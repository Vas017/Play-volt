<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PLAY-VOLT V2 // Asset Review Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020817;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}#app{position:fixed;inset:0}canvas{display:block}.panel{position:fixed;z-index:5;left:14px;right:14px;top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}.glass{background:linear-gradient(145deg,#0b3555dc,#041326e8);border:1px solid #7df3ff70;box-shadow:0 12px 32px #00142faa,inset 0 1px 0 #d9fbff38;backdrop-filter:blur(10px);border-radius:18px}.brand{padding:11px 15px;font-weight:1000;font-style:italic;letter-spacing:-1px}.brand span{color:#45edff}.status{padding:10px 13px;font-size:11px;letter-spacing:.7px;text-align:right}.controls{position:fixed;z-index:6;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:42vh;overflow:auto;padding-bottom:max(0px,env(safe-area-inset-bottom))}.asset{border:1px solid #6befff70;border-radius:15px;background:linear-gradient(145deg,#0b3555df,#041326e9);color:#fff;padding:11px 9px;font-weight:800;font-size:11px;box-shadow:0 8px 24px #00152f88;-webkit-tap-highlight-color:transparent}.asset small{display:block;font-size:8px;opacity:.62;margin-top:3px;font-weight:600}.asset.active{border-color:#fff;box-shadow:0 0 24px #35eaff88,0 8px 24px #00152f88;background:linear-gradient(145deg,#116080ef,#06243def)}.note{position:fixed;z-index:5;left:14px;bottom:calc(42vh + 28px);max-width:min(360px,70vw);padding:11px 13px;font-size:10px;line-height:1.35;pointer-events:none}.loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#020817;color:#8ff8ff;font-weight:900;letter-spacing:2px}.loading.hidden{display:none}@media(min-width:800px){.controls{grid-template-columns:repeat(5,1fr);max-width:900px;left:50%;right:auto;transform:translateX(-50%);max-height:none}.note{bottom:95px}.status{font-size:12px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="loading" id="loading">LOADING REAL GLB ASSET…</div>
  <div class="panel">
    <div class="glass brand">PLAY-<span>VOLT</span> V2</div>
    <div class="glass status"><b id="assetName">Asset Review Studio</b><br><span id="assetMeta">No gameplay — visual approval first</span></div>
  </div>
  <div class="glass note">Orbit / pinch / drag to inspect the real 3D asset. Reject anything that still looks too basic before any gameplay is built.</div>
  <div class="controls" id="controls"></div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script type="module" src="asset-stage.js"></script>
</body>
</html>
