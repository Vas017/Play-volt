<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PLAY-VOLT</title>

<style>
*{
  box-sizing:border-box;
    margin:0;
      padding:0;
        -webkit-tap-highlight-color:transparent;
        }

        html,body{
          width:100%;
            height:100%;
              overflow:hidden;
                font-family:Arial,sans-serif;
                  background:#071528;
                  }

                  canvas{
                    position:fixed;
                      inset:0;
                        width:100%;
                          height:100%;
                            display:block;
                            }

                            #menu{
                              position:fixed;
                                inset:0;
                                  display:flex;
                                    flex-direction:column;
                                      align-items:center;
                                        justify-content:center;
                                          color:white;
                                            text-align:center;
                                              background:linear-gradient(#09284d,#126cb1 55%,#dff7ff 56%,#fff);
                                              }

                                              .logo{
                                                font-size:48px;
                                                  font-weight:900;
                                                    font-style:italic;
                                                      letter-spacing:-3px;
                                                        text-shadow:0 5px 0 #07203c;
                                                        }

                                                        .logo span{
                                                          color:#49dcff;
                                                          }

                                                          .sled{
                                                            font-size:82px;
                                                              margin:22px 0 8px;
                                                                filter:drop-shadow(0 8px 3px rgba(0,0,0,.3));
                                                                }

                                                                .tag{
                                                                  font-size:17px;
                                                                    font-weight:bold;
                                                                      margin-bottom:28px;
                                                                        text-shadow:0 2px 4px #000;
                                                                        }

                                                                        button{
                                                                          border:0;
                                                                            border-radius:18px;
                                                                              font-weight:900;
                                                                                cursor:pointer;
                                                                                }

                                                                                #play{
                                                                                  width:220px;
                                                                                    padding:18px;
                                                                                      font-size:27px;
                                                                                        color:#05243b;
                                                                                          background:#59e6ff;
                                                                                            box-shadow:0 7px 0 #1686ad;
                                                                                            }

                                                                                            #play:active{
                                                                                              transform:translateY(5px);
                                                                                                box-shadow:0 2px 0 #1686ad;
                                                                                                }

                                                                                                #hud{
                                                                                                  position:fixed;
                                                                                                    top:18px;
                                                                                                      left:0;
                                                                                                        right:0;
                                                                                                          padding:0 18px;
                                                                                                            display:none;
                                                                                                              justify-content:space-between;
                                                                                                                color:white;
                                                                                                                  font-weight:900;
                                                                                                                    font-size:19px;
                                                                                                                      text-shadow:0 2px 4px #000;
                                                                                                                        pointer-events:none;
                                                                                                                        }

                                                                                                                        #instructions{
                                                                                                                          position:fixed;
                                                                                                                            bottom:22px;
                                                                                                                              left:50%;
                                                                                                                                transform:translateX(-50%);
                                                                                                                                  color:white;
                                                                                                                                    background:rgba(0,0,0,.38);
                                                                                                                                      padding:10px 16px;
                                                                                                                                        border-radius:20px;
                                                                                                                                          font-size:13px;
                                                                                                                                            display:none;
                                                                                                                                              white-space:nowrap;
                                                                                                                                              }

                                                                                                                                              #gameover{
                                                                                                                                                position:fixed;
                                                                                                                                                  inset:0;
                                                                                                                                                    display:none;
                                                                                                                                                      align-items:center;
                                                                                                                                                        justify-content:center;
                                                                                                                                                          flex-direction:column;
                                                                                                                                                            background:rgba(2,12,25,.72);
                                                                                                                                                              color:white;
                                                                                                                                                                text-align:center;
                                                                                                                                                                }

                                                                                                                                                                #gameover h2{
                                                                                                                                                                  font-size:42px;
                                                                                                                                                                    margin-bottom:8px;
                                                                                                                                                                    }

                                                                                                                                                                    #finalScore{
                                                                                                                                                                      font-size:21px;
                                                                                                                                                                        margin-bottom:25px;
                                                                                                                                                                        }

                                                                                                                                                                        #again{
                                                                                                                                                                          padding:15px 35px;
                                                                                                                                                                            font-size:20px;
                                                                                                                                                                              color:#06233c;
                                                                                                                                                                                background:#5de7ff;
                                                                                                                                                                                  box-shadow:0 6px 0 #177fa3;
                                                                                                                                                                                  }
                                                                                                                                                                                  </style>
                                                                                                                                                                                  </head>

                                                                                                                                                                                  <body>

                                                                                                                                                                                  <canvas id="game"></canvas>

                                                                                                                                                                                  <div id="menu">
                                                                                                                                                                                    <div class="logo">PLAY-<span>VOLT</span></div>
                                                                                                                                                                                      <div class="sled">🛷</div>
                                                                                                                                                                                        <div class="tag">RIDE • DODGE • SURVIVE</div>
                                                                                                                                                                                          <button id="play">PLAY</button>
                                                                                                                                                                                          </div>

                                                                                                                                                                                          <div id="hud">
                                                                                                                                                                                            <div>⚡ <span id="score">0</span></div>
                                                                                                                                                                                              <div>BEST <span id="best">0</span></div>
                                                                                                                                                                                              </div>

                                                                                                                                                                                              <div id="instructions">Drag left & right to steer 🛷</div>

                                                                                                                                                                                              <div id="gameover">
                                                                                                                                                                                                <h2>CRASH!</h2>
                                                                                                                                                                                                  <div id="finalScore">Score: 0</div>
                                                                                                                                                                                                    <button id="again">RIDE AGAIN</button>
                                                                                                                                                                                                    </div>

                                                                                                                                                                                                    <script>
                                                                                                                                                                                                    const canvas = document.getElementById("game");
                                                                                                                                                                                                    const ctx = canvas.getContext("2d");

                                                                                                                                                                                                    let W,H;
                                                                                                                                                                                                    let playing=false;
                                                                                                                                                                                                    let score=0;
                                                                                                                                                                                                    let speed=6;
                                                                                                                                                                                                    let obstacles=[];
                                                                                                                                                                                                    let snow=[];
                                                                                                                                                                                                    let player={x:0,y:0,w:60,h:40};

                                                                                                                                                                                                    const menu=document.getElementById("menu");
                                                                                                                                                                                                    const hud=document.getElementById("hud");
                                                                                                                                                                                                    const instructions=document.getElementById("instructions");
                                                                                                                                                                                                    const gameover=document.getElementById("gameover");
                                                                                                                                                                                                    const scoreEl=document.getElementById("score");
                                                                                                                                                                                                    const bestEl=document.getElementById("best");

                                                                                                                                                                                                    let best=Number(localStorage.getItem("playvolt-best")||0);
                                                                                                                                                                                                    bestEl.textContent=best;

                                                                                                                                                                                                    function resize(){
                                                                                                                                                                                                      canvas.width=innerWidth*devicePixelRatio;
                                                                                                                                                                                                        canvas.height=innerHeight*devicePixelRatio;
                                                                                                                                                                                                          canvas.style.width=innerWidth+"px";
                                                                                                                                                                                                            canvas.style.height=innerHeight+"px";

                                                                                                                                                                                                              ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

                                                                                                                                                                                                                W=innerWidth;
                                                                                                                                                                                                                  H=innerHeight;

                                                                                                                                                                                                                    player.y=H-120;
                                                                                                                                                                                                                      if(!playing) player.x=W/2;
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                      addEventListener("resize",resize);
                                                                                                                                                                                                                      resize();

                                                                                                                                                                                                                      for(let i=0;i<70;i++){
                                                                                                                                                                                                                        snow.push({
                                                                                                                                                                                                                            x:Math.random()*W,
                                                                                                                                                                                                                                y:Math.random()*H,
                                                                                                                                                                                                                                    r:Math.random()*2+1,
                                                                                                                                                                                                                                        s:Math.random()*3+1
                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                          function start(){
                                                                                                                                                                                                                                            playing=true;
                                                                                                                                                                                                                                              score=0;
                                                                                                                                                                                                                                                speed=6;
                                                                                                                                                                                                                                                  obstacles=[];
                                                                                                                                                                                                                                                    player.x=W/2;

                                                                                                                                                                                                                                                      menu.style.display="none";
                                                                                                                                                                                                                                                        gameover.style.display="none";
                                                                                                                                                                                                                                                          hud.style.display="flex";
                                                                                                                                                                                                                                                            instructions.style.display="block";

                                                                                                                                                                                                                                                              setTimeout(()=>{
                                                                                                                                                                                                                                                                  instructions.style.display="none";
                                                                                                                                                                                                                                                                    },2500);

                                                                                                                                                                                                                                                                      requestAnimationFrame(loop);
                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                      document.getElementById("play").onclick=start;
                                                                                                                                                                                                                                                                      document.getElementById("again").onclick=start;

                                                                                                                                                                                                                                                                      function steer(clientX){
                                                                                                                                                                                                                                                                        if(!playing) return;

                                                                                                                                                                                                                                                                          const margin=38;
                                                                                                                                                                                                                                                                            player.x=Math.max(
                                                                                                                                                                                                                                                                                margin,
                                                                                                                                                                                                                                                                                    Math.min(W-margin,clientX)
                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                      canvas.addEventListener("touchmove",e=>{
                                                                                                                                                                                                                                                                                        e.preventDefault();
                                                                                                                                                                                                                                                                                          steer(e.touches[0].clientX);
                                                                                                                                                                                                                                                                                          },{passive:false});

                                                                                                                                                                                                                                                                                          canvas.addEventListener("touchstart",e=>{
                                                                                                                                                                                                                                                                                            steer(e.touches[0].clientX);
                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                            canvas.addEventListener("mousemove",e=>{
                                                                                                                                                                                                                                                                                              if(e.buttons) steer(e.clientX);
                                                                                                                                                                                                                                                                                              });

                                                                                                                                                                                                                                                                                              function spawnObstacle(){
                                                                                                                                                                                                                                                                                                const size=35+Math.random()*28;

                                                                                                                                                                                                                                                                                                  obstacles.push({
                                                                                                                                                                                                                                                                                                      x:35+Math.random()*(W-70),
                                                                                                                                                                                                                                                                                                          y:-70,
                                                                                                                                                                                                                                                                                                              size:size,
                                                                                                                                                                                                                                                                                                                  type:Math.random()>.45 ? "tree":"rock"
                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                    function drawBackground(){
                                                                                                                                                                                                                                                                                                                      const sky=ctx.createLinearGradient(0,0,0,H);
                                                                                                                                                                                                                                                                                                                        sky.addColorStop(0,"#061a35");
                                                                                                                                                                                                                                                                                                                          sky.addColorStop(.48,"#1479b7");
                                                                                                                                                                                                                                                                                                                            sky.addColorStop(.49,"#dff8ff");
                                                                                                                                                                                                                                                                                                                              sky.addColorStop(1,"#f8fdff");

                                                                                                                                                                                                                                                                                                                                ctx.fillStyle=sky;
                                                                                                                                                                                                                                                                                                                                  ctx.fillRect(0,0,W,H);

                                                                                                                                                                                                                                                                                                                                    ctx.fillStyle="#c9efff";
                                                                                                                                                                                                                                                                                                                                      ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                        ctx.moveTo(0,H*.46);
                                                                                                                                                                                                                                                                                                                                          ctx.lineTo(W*.22,H*.27);
                                                                                                                                                                                                                                                                                                                                            ctx.lineTo(W*.42,H*.46);
                                                                                                                                                                                                                                                                                                                                              ctx.lineTo(W*.68,H*.20);
                                                                                                                                                                                                                                                                                                                                                ctx.lineTo(W,H*.46);
                                                                                                                                                                                                                                                                                                                                                  ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                    ctx.fill();

                                                                                                                                                                                                                                                                                                                                                      ctx.fillStyle="#effbff";
                                                                                                                                                                                                                                                                                                                                                        ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                          ctx.moveTo(0,H*.48);
                                                                                                                                                                                                                                                                                                                                                            ctx.lineTo(W*.27,H*.34);
                                                                                                                                                                                                                                                                                                                                                              ctx.lineTo(W*.45,H*.48);
                                                                                                                                                                                                                                                                                                                                                                ctx.lineTo(W*.73,H*.29);
                                                                                                                                                                                                                                                                                                                                                                  ctx.lineTo(W,H*.48);
                                                                                                                                                                                                                                                                                                                                                                    ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                      ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle="rgba(70,180,225,.25)";
                                                                                                                                                                                                                                                                                                                                                                          ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                            ctx.moveTo(W*.12,H);
                                                                                                                                                                                                                                                                                                                                                                              ctx.lineTo(W*.43,H*.48);
                                                                                                                                                                                                                                                                                                                                                                                ctx.lineTo(W*.58,H*.48);
                                                                                                                                                                                                                                                                                                                                                                                  ctx.lineTo(W*.88,H);
                                                                                                                                                                                                                                                                                                                                                                                    ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                                      ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                      function drawSnow(){
                                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle="white";

                                                                                                                                                                                                                                                                                                                                                                                          for(const s of snow){
                                                                                                                                                                                                                                                                                                                                                                                              ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                  ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                      ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                          if(playing){
                                                                                                                                                                                                                                                                                                                                                                                                                s.y+=s.s+speed*.18;

                                                                                                                                                                                                                                                                                                                                                                                                                      if(s.y>H){
                                                                                                                                                                                                                                                                                                                                                                                                                              s.y=-5;
                                                                                                                                                                                                                                                                                                                                                                                                                                      s.x=Math.random()*W;
                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                  function drawPlayer(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.translate(player.x,player.y);

                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle="#17304d";
                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.fillRect(-27,8,54,8);

                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.strokeStyle="#071522";
                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.lineWidth=4;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.moveTo(-31,19);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.quadraticCurveTo(-15,28,5,20);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.stroke();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.moveTo(0,19);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.quadraticCurveTo(18,28,32,18);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.stroke();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle="#ff3d45";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.fillRect(-23,-12,46,24);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillStyle="#ffdc45";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.arc(0,-21,13,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle="#101a29";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.fillRect(-10,-32,20,8);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.restore();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function drawObstacle(o){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(o.type==="tree"){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.fillStyle="#6b432b";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.fillRect(o.x-5,o.y+o.size*.35,10,o.size*.5);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.fillStyle="#0b694c";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for(let i=0;i<3;i++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.moveTo(o.x,o.y-i*12);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineTo(o.x-o.size*.42,o.y+o.size*.55-i*7);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.lineTo(o.x+o.size*.42,o.y+o.size*.55-i*7);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.closePath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }else{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle="#75889a";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.arc(o.x,o.y,o.size*.42,0,Math.PI*2);
