                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle="#a9bbc8";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.arc(o.x-o.size*.12,o.y-o.size*.12,o.size*.17,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function collision(o){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Math.abs(player.x-o.x)<(player.w/2+o.size*.28) &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Math.abs(player.y-o.y)<(player.h/2+o.size*.28)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function endGame(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            playing=false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(score>best){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  best=score;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      localStorage.setItem("playvolt-best",best);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          bestEl.textContent=best;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("finalScore").textContent="Score: "+score;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                hud.style.display="none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  instructions.style.display="none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    gameover.style.display="flex";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let frame=0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function loop(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(!playing) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        frame++;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          drawBackground();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            drawSnow();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(frame%Math.max(30,Math.floor(75-speed*2))===0){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  spawnObstacle();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      speed=Math.min(14,6+score/180);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for(let i=obstacles.length-1;i>=0;i--){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const o=obstacles[i];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                o.y+=speed;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    drawObstacle(o);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(collision(o)){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              endGame();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(o.y>H+80){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  obstacles.splice(i,1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        score++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              scoreEl.textContent=score;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      drawPlayer();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        requestAnimationFrame(loop);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
