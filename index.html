<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT // FROSTBOUND</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b1c;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #001}.top{display:flex;justify-content:space-between;padding:12px}.row{display:flex;gap:7px}.glass{background:linear-gradient(180deg,#08274be8,#03162fe8);border:1px solid #8cecff77;box-shadow:0 7px 24px #00152fbb,inset 0 0 20px #28dfff12;border-radius:16px}.pill{padding:9px 12px;font-weight:900}.mission{position:absolute;left:12px;top:68px;width:190px;padding:12px;font-size:11px;font-weight:900}.mission b{display:block;font-size:14px;margin:5px 0}.bar{height:6px;border-radius:9px;background:#244463;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#26dfff,#b8ffff)}.speed{position:absolute;right:12px;top:68px;padding:9px 13px;text-align:right;font-size:10px;letter-spacing:2px;font-weight:900}.speed b{display:block;color:#72efff;font-size:25px;letter-spacing:1px}.controls{position:absolute;right:16px;bottom:25px;display:grid;gap:12px;pointer-events:auto}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #dff;background:#0c3159df;color:white;font-size:30px;box-shadow:0 7px 22px #00152f, inset 0 0 20px #7eefff22}.steer{position:absolute;left:15px;bottom:27px;display:flex;gap:9px;pointer-events:auto}.steer .btn{width:59px;height:59px}.logo{position:absolute;left:18px;bottom:100px;font-size:20px;font-style:italic;font-weight:1000}.logo em{color:#51eaff;font-style:normal}.menu{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center;background:linear-gradient(#020c1d44,#020c1dcc);text-shadow:0 3px 8px #001}.title{font-size:43px;font-weight:1000;font-style:italic;letter-spacing:-3px}.title span{color:#55eaff;text-shadow:0 0 24px #19dfff}.sub{letter-spacing:7px;font-weight:900;font-size:12px}.play{margin-top:26px;padding:16px 58px;border-radius:15px;border:1px solid white;background:linear-gradient(#8dffff,#1ac7f2);color:#063356;font-size:20px;font-weight:1000;box-shadow:0 6px #087ca4,0 0 28px #4beaff88}.hint{position:absolute;bottom:16px;font-size:10px;opacity:.8}.flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="glass pill">🪙 <span id="coins">2450</span></div><div class="row"><div class="glass pill">💎 180</div><div class="glass pill">⚡ <span id="energy">100</span>%</div></div></div><div class="glass mission">FROST MISSIONS<b>⚡ VOLT ORBS <span id="orbs">0</span>/20</b><b>⭐ RAMPS <span id="ramps">0</span>/5</b><b>🏁 <span id="dist">0</span>/3000m</b><div class="bar"><i id="prog"></i></div></div><div class="glass speed">VELOCITY<b><span id="speed">96</span> KM/H</b></div><div class="steer"><button class="btn" id="left">‹</button><button class="btn" id="right">›</button></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn" id="boost">⚡</button></div><div class="logo">PLAY-<em>VOLT</em></div></div><div class="menu" id="menu"><div class="title">PLAY-<span>VOLT</span></div><div class="sub">FROSTBOUND</div><button class="play" id="play">RIDE</button><div class="hint">DRAG OR USE ARROWS · JUMP · HOLD BOOST</div></div><div class="flash" id="flash"></div><script>const C=document.getElementById('c'),g=C.getContext('2d');let W,H,D=Math.min(devicePixelRatio,2),run=0,T=0,lane=0,jy=0,jv=0,boost=0,energy=100,dist=0,orbs=0,ramps=0,coins=2450,objects=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;g.setTransform(D,0,0,D,0,0)}resize();onresize=resize;function poly(p,f,s,w=1){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath();if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=w;g.stroke()}}function glow(c,n){g.shadowColor=c;g.shadowBlur=n}function mountain(cx,base,sz,col){poly([[cx-sz,base],[cx-sz*.68,base-sz*.32],[cx-sz*.42,base-sz*.2],[cx-sz*.12,base-sz*.72],[cx+sz*.08,base-sz*.42],[cx+sz*.3,base-sz*.88],[cx+sz*.5,base-sz*.36],[cx+sz,base]],col);poly([[cx-sz*.2,base-sz*.55],[cx+sz*.3,base-sz*.88],[cx+sz*.46,base-sz*.47],[cx+sz*.26,base-sz*.57],[cx+sz*.08,base-sz*.42]],'#e9fbffdd')}function sky(){let q=g.createLinearGradient(0,0,0,H*.55);q.addColorStop(0,'#02071b');q.addColorStop(.42,'#082b62');q.addColorStop(1,'#268bc1');g.fillStyle=q;g.fillRect(0,0,W,H);for(let i=0;i<75;i++){g.globalAlpha=.25+(i%7)/10;g.fillStyle='white';g.fillRect((i*79)%W,(i*43)%Math.max(180,H*.42),1.2,1.2)}g.globalAlpha=1;g.save();g.globalCompositeOperation='screen';for(let i=0;i<4;i++){let a=g.createLinearGradient(0,0,W,0);a.addColorStop(0,'#00ffbf00');a.addColorStop(.35,'#1fffd055');a.addColorStop(.65,'#2feaff44');a.addColorStop(1,'#9d5cff00');g.strokeStyle=a;g.lineWidth=18+i*7;g.globalAlpha=.15;g.beginPath();g.moveTo(-40,50+i*22);g.bezierCurveTo(W*.3,5+i*30,W*.55,145-i*15,W+40,25+i*18);g.stroke()}g.restore();mountain(W*.18,H*.38,W*.34,'#123c68');mountain(W*.66,H*.4,W*.45,'#174b79');mountain(W*.9,H*.42,W*.3,'#0d365d')}function pine(x,y,s){g.fillStyle='#102b34';g.fillRect(x-2*s,y,4*s,17*s);for(let i=0;i<4;i++)poly([[x,y-38*s+i*9*s],[x-15*s+i*s,y-5*s+i*7*s],[x+15*s-i*s,y-5*s+i*7*s]],i<2?'#0c5360':'#0a3d4b');g.strokeStyle='#dff';g.globalAlpha=.6;g.lineWidth=2*s;g.beginPath();g.moveTo(x,y-36*s);g.lineTo(x-10*s,y-11*s);g.stroke();g.globalAlpha=1}function house(x,y,s){g.fillStyle='#392725';g.fillRect(x-18*s,y-18*s,36*s,25*s);poly([[x-23*s,y-18*s],[x,y-37*s],[x+23*s,y-18*s]],'#f1fbff');g.fillStyle='#ffb641';glow('#ff9b22',12);g.fillRect(x-11*s,y-10*s,7*s,7*s);g.fillRect(x+5*s,y-10*s,7*s,7*s);g.shadowBlur=0}function castle(x,y,s){g.fillStyle='#142f48';for(let k=-1;k<=1;k++){let xx=x+k*30*s,h=(k?48:68)*s;g.fillRect(xx-9*s,y-h,18*s,h);poly([[xx-13*s,y-h],[xx,y-h-24*s],[xx+13*s,y-h]],'#d9f8ff');g.fillStyle='#ffc05b';glow('#ff9a28',8);for(let j=0;j<3;j++)g.fillRect(xx-3*s,y-h+12*s+j*13*s,6*s,7*s);g.shadowBlur=0;g.fillStyle='#142f48'}}function scenery(){let h=H*.39;g.fillStyle='#e6f9ff';g.fillRect(0,h,W,H-h);castle(W*.22,h+8,.6);castle(W*.77,h+14,.45);for(let i=0;i<5;i++)house(W*(.1+i*.2),h+32+(i%2)*18,.42);let cliff='#214c66';poly([[0,h-5],[W*.18,h-5],[W*.23,h+85],[0,h+100]],cliff);poly([[W*.79,h+20],[W,h-8],[W,h+120],[W*.74,h+90]],cliff);let fall=g.createLinearGradient(0,h,0,h+150);fall.addColorStop(0,'#efffff');fall.addColorStop(.35,'#51d8ff');fall.addColorStop(1,'#bff7ff');g.fillStyle=fall;glow('#50eaff',16);g.fillRect(W*.11,h-4,W*.055,Math.min(150,H*.19));g.fillRect(W*.86,h+15,W*.04,Math.min(120,H*.16));g.shadowBlur=0;let road=g.createLinearGradient(0,h,0,H);road.addColorStop(0,'#dffbff');road.addColorStop(1,'#83cce9');poly([[W*.43,h],[W*.57,h],[W*.96,H],[W*.04,H]],road);for(let i=0;i<13;i++){let q=((i/13+T*.00009)%1),y=mix(h,H,q*q),half=mix(W*.06,W*.45,q);g.globalAlpha=.18+.5*q;g.strokeStyle='#1bb8e5';g.lineWidth=1+q*3;g.beginPath();g.moveTo(W/2-half,y);g.lineTo(W/2+half,y);g.stroke()}g.globalAlpha=1;for(let i=0;i<13;i++){let q=((i*.081+T*.000035)%1),y=mix(h,H,q*q),s=mix(.12,1.35,q);pine(W*.08+(i%3)*W*.055,y,s);pine(W*.92-(i%4)*W*.045,y,s)}}function spawn(){let r=Math.random(),type=r<.58?'orb':r<.77?'coin':'ramp';objects.push({type,z:.02,l:[-.28,0,.28][Math.floor(Math.random()*3)],hit:0})}function worldObjects(){if(run&&Math.random()<.016)spawn();for(let o of objects){o.z+=boost?.009:.006;let q=o.z,y=mix(H*.4,H*1.02,q*q),x=W/2+o.l*W*q,s=mix(5,45,q);if(o.type==='orb'){glow('#ffd52b',22);let rg=g.createRadialGradient(x-s*.2,y-s*.2,2,x,y,s*.55);rg.addColorStop(0,'#fff9a8');rg.addColorStop(.45,'#ffd318');rg.addColorStop(1,'#e48b00');g.fillStyle=rg;g.beginPath();g.arc(x,y,s*.55,0,7);g.fill();g.strokeStyle='#fff6a4';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font=`bold ${s*.65}px Arial`;g.textAlign='center';g.fillText('ϟ',x,y+s*.22);g.shadowBlur=0}else if(o.type==='coin'){glow('#ffe66a',15);g.fillStyle='#ffca20';g.beginPath();g.arc(x,y,s*.38,0,7);g.fill();g.shadowBlur=0}else{glow('#ff8b00',20);poly([[x-s,y+s*.45],[x+s,y+s*.45],[x+s*.62,y-s*.52],[x-s*.62,y-s*.52]],'#e76b0a','#ffe177',3);g.fillStyle='#fff36a';g.font=`bold ${s}px Arial`;g.textAlign='center';g.fillText('⌃',x,y+s*.25);g.shadowBlur=0}if(!o.hit&&q>.84&&q<1.04&&Math.abs(o.l-lane)<.2){o.hit=1;if(o.type==='orb'){orbs++;energy=Math.min(100,energy+10);coins+=3;flash()}else if(o.type==='coin')coins++;else{ramps++;if(!jy)jv=-13}}}objects=objects.filter(o=>o.z<1.12&&!o.hit)}function rider(){let x=W/2+lane*W*.78,y=H*.79+jy,s=Math.min(W,H)/390;g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha=.25;g.fillStyle='#174d67';g.beginPath();g.ellipse(0,66,68,16,0,0,7);g.fill();g.globalAlpha=1;glow('#16dfff',22);g.strokeStyle='#53efff';g.lineWidth=8;g.beginPath();g.moveTo(-62,54);g.quadraticCurveTo(-45,70,-20,63);g.moveTo(62,54);g.quadraticCurveTo(45,70,20,63);g.stroke();g.shadowBlur=0;let body=g.createLinearGradient(0,-25,0,70);body.addColorStop(0,'#193e60');body.addColorStop(.55,'#07192e');body.addColorStop(1,'#020914');poly([[-58,30],[-42,-2],[-22,-20],[22,-20],[42,-2],[58,30],[43,68],[-43,68]],body,'#36eaff',2);g.fillStyle='#101a2a';g.beginPath();g.ellipse(0,-52,24,37,0,0,7);g.fill();g.fillStyle='#0a1527';g.fillRect(-17,-85,34,34);let helm=g.createRadialGradient(-8,-100,4,0,-91,27);helm.addColorStop(0,'#dfffff');helm.addColorStop(.35,'#4da4c8');helm.addColorStop(1,'#071526');g.fillStyle=helm;g.beginPath();g.arc(0,-93,25,0,7);g.fill();glow('#28eaff',15);g.fillStyle='#3eeaff';g.font='bold 32px Arial';g.textAlign='center';g.fillText('ϟ',0,20);g.shadowBlur=0;if(boost){glow('#7fffff',25);poly([[-34,68],[-12,68],[-25,135]],'#7efaff');poly([[34,68],[12,68],[25,135]],'#7efaff');g.shadowBlur=0}g.restore()}function snow(){for(let i=0;i<75;i++){let q=((i*41+T*.1)%1000)/1000,x=(i*97+T*(boost?.18:.05))%(W+80)-40,y=q*H;g.globalAlpha=.2+.75*q;g.fillStyle='white';g.beginPath();g.arc(x,y,1+q*2.8,0,7);g.fill()}g.globalAlpha=1}function flash(){let f=document.getElementById('flash');f.style.opacity=.6;setTimeout(()=>f.style.opacity=0,70)}function frame(t){T=t;sky();scenery();worldObjects();snow();rider();if(run){dist+=boost?.28:.15;energy=clamp(energy+(boost?-.14:.025),0,100);if(!energy)boost=0;if(jy<0||jv<0){jy+=jv;jv+=.75;if(jy>0){jy=0;jv=0}}energyEl.textContent=Math.ceil(energy);orbsEl.textContent=orbs;rampsEl.textContent=ramps;distEl.textContent=Math.floor(dist);speedEl.textContent=Math.floor((boost?174:108)+Math.min(35,dist/70));coinsEl.textContent=coins;prog.style.width=Math.min(100,dist/30)+'%'}requestAnimationFrame(frame)}requestAnimationFrame(frame);const $=id=>document.getElementById(id),energyEl=$('energy'),orbsEl=$('orbs'),rampsEl=$('ramps'),distEl=$('dist'),speedEl=$('speed'),coinsEl=$('coins'),prog=$('prog');$('play').onclick=()=>{run=1;$('menu').style.display='none'};function setLane(v){lane=clamp(v,-.3,.3)}C.onpointerdown=C.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')setLane((e.clientX/W-.5)*.75)};$('left').onclick=()=>setLane(lane-.28);$('right').onclick=()=>setLane(lane+.28);$('jump').onclick=()=>{if(!jy)jv=-13};let B=$('boost');B.onpointerdown=()=>{if(energy>1)boost=1};B.onpointerup=B.onpointercancel=B.onpointerleave=()=>boost=0;</script></body></html>
