<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT FROSTBOUND</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02091b;font-family:Arial,sans-serif;touch-action:none}.world{position:fixed;inset:-4%;background:url('frostbound-concept.svg') center/cover no-repeat;transform:scale(1.08);transition:transform .12s;filter:saturate(1.18) contrast(1.05)}.shade{position:fixed;inset:0;background:linear-gradient(#00102b18,#00102b00 50%,#00102b55)}.hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 6px #00152f;pointer-events:none}.glass{background:linear-gradient(180deg,#06284be8,#03152ee8);border:1px solid #75e7ff99;box-shadow:0 7px 24px #00152fcc,inset 0 0 20px #39dfff18;border-radius:18px}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.row{display:flex;gap:8px}.pill{padding:10px 14px;font-weight:900;font-size:16px}.mission{position:absolute;left:14px;top:78px;width:205px;padding:13px;font-size:11px;font-weight:900}.mission strong{display:block;font-size:15px;margin:7px 0}.bar{height:7px;background:#244765;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#24ddff,#d8ffff)}.speed{position:absolute;right:14px;top:78px;padding:11px 15px;text-align:right;font-size:10px;letter-spacing:2px;font-weight:900}.speed b{display:block;color:#6cf1ff;font-size:27px;letter-spacing:1px}.logo{position:absolute;left:18px;top:205px;font-size:27px;font-weight:1000;font-style:italic;filter:drop-shadow(0 0 9px #28cfff)}.logo em{color:#44eaff;font-style:normal}.controls{position:absolute;right:17px;bottom:30px;display:grid;gap:13px;pointer-events:auto}.steer{position:absolute;left:17px;bottom:32px;display:flex;gap:12px;pointer-events:auto}.btn{width:74px;height:74px;border-radius:50%;border:2px solid #dff;background:#092c55dc;color:#fff;font-size:32px;box-shadow:0 7px 25px #00172f,inset 0 0 25px #6ff3ff22}.steer .btn{width:66px;height:66px}.boost{border-color:#5ef7ff;box-shadow:0 0 24px #28dcff,0 7px 25px #00172f}.snow{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.4px,transparent 1.6px),radial-gradient(#dff 1px,transparent 1.2px);background-size:73px 79px,47px 53px;animation:snow 3.5s linear infinite;opacity:.65}@keyframes snow{to{background-position:40px 160px,-30px 120px}}.menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#00102466;color:#fff;text-align:center}.title{font-size:44px;font-weight:1000;font-style:italic}.title span{color:#48eaff}.sub{font-size:13px;letter-spacing:8px;font-weight:900}.play{margin-top:24px;padding:17px 65px;border:1px solid #fff;border-radius:17px;background:linear-gradient(#86f8ff,#16c7f2);color:#07314e;font-size:21px;font-weight:1000;box-shadow:0 7px #087ea7,0 0 35px #42e8ff88}@media(max-width:420px){.logo{top:210px;font-size:22px}.mission{width:190px}.speed b{font-size:23px}}</style></head><body><div class="world" id="world"></div><div class="shade"></div><div class="snow"></div><div class="hud"><div class="top"><div class="glass pill">🪙 <span id="coins">2450</span></div><div class="row"><div class="glass pill">💎 180</div><div class="glass pill">⚡ <span id="energy">100</span>%</div></div></div><div class="glass mission">FROST MISSIONS<strong>⚡ VOLT ORBS <span id="orbs">0</span>/20</strong><strong>⭐ RAMPS <span id="ramps">0</span>/5</strong><strong>🏁 <span id="dist">0</span>/3000m</strong><div class="bar"><i id="prog"></i></div></div><div class="glass speed">VELOCITY<b><span id="speed">108</span> KM/H</b></div><div class="logo">PLAY-<em>VOLT</em></div><div class="steer"><button class="btn" id="left">‹</button><button class="btn" id="right">›</button></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn boost" id="boost">⚡</button></div></div><div class="menu" id="menu"><div class="title">PLAY-<span>VOLT</span></div><div class="sub">FROSTBOUND</div><button class="play" id="play">RIDE</button></div><script>let run=0,dist=0,energy=100,orbs=0,ramps=0,coins=2450,lane=0,boost=0,jump=0;const $=x=>document.getElementById(x),world=$('world');$('play').onclick=()=>{run=1;$('menu').style.display='none'};function steer(d){lane=Math.max(-1,Math.min(1,lane+d));world.style.transform=`scale(1.12) translateX(${-lane*2.7}%) rotate(${lane*.35}deg)`}$('left').onclick=()=>steer(-.35);$('right').onclick=()=>steer(.35);$('jump').onclick=()=>{jump=1;world.style.transform+=` translateY(2.2%)`;setTimeout(()=>{jump=0;steer(0)},300)};let B=$('boost');B.onpointerdown=()=>boost=1;B.onpointerup=B.onpointercancel=B.onpointerleave=()=>boost=0;let sx=0;document.body.onpointerdown=e=>sx=e.clientX;document.body.onpointerup=e=>{let d=e.clientX-sx;if(Math.abs(d)>35)steer(d>0?.35:-.35)};function tick(){if(run){let v=boost&&energy>1?188:128;dist+=boost?.55:.3;if(boost)energy=Math.max(0,energy-.32);else energy=Math.min(100,energy+.08);if(Math.random()<.012){orbs++;coins+=3}if(Math.random()<.003)ramps++;$('dist').textContent=Math.floor(dist);$('speed').textContent=v+Math.floor(Math.sin(Date.now()/250)*7);$('energy').textContent=Math.floor(energy);$('orbs').textContent=orbs;$('ramps').textContent=ramps;$('coins').textContent=coins;$('prog').style.width=Math.min(100,dist/30)+'%';world.style.backgroundPosition=`center ${50+(dist%400)/80}%`}requestAnimationFrame(tick)}tick();</script></body></html>
