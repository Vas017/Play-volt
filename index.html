(0xf2fbff,.65),rock=m(0x153b62,.85),wood=m(0x3b241b,.75),dark=m(0x06182b,.28,.7);const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(42,450),snow);ground.rotation.x=-Math.PI/2;ground.position.z=-205;ground.receiveShadow=true;world.add(ground);const ice=new THREE.Mesh(new THREE.PlaneGeometry(9,450),new THREE.MeshPhysicalMaterial({color:0x73eaff,roughness:.13,metalness:.1,transparent:true,opacity:.72,clearcoat:1}));ice.rotation.x=-Math.PI/2;ice.position.set(0,.025,-205);world.add(ice);function mountain(x,z,s){const a=new THREE.Mesh(new THREE.ConeGeometry(s,s*2.3,7),rock);a.position.set(x,s*.85,z);a.rotation.y=Math.random();world.add(a);const c=new THREE.Mesh(new THREE.ConeGeometry(s*.65,s*.8,7),snow);c.position.set(x,s*1.72,z);c.rotation.y=a.rotation.y;world.add(c)}for(let z=-42;z>-240;z-=30){mountain(-18-Math.random()*14,z,8+Math.random()*9);mountain(18+Math.random()*14,z-12,8+Math.random()*10)}function pine(x,z,s=1){const t=new THREE.Mesh(new THREE.CylinderGeometry(.1*s,.16*s,1.2*s,7),wood);t.position.set(x,.6*s,z);world.add(t);for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.ConeGeometry((.9-i*.13)*s,1.7*s,9),m(i?0x08717c:0x095463,.7));p.position.set(x,(1.2+i*.48)*s,z);p.castShadow=true;world.add(p)}}for(let z=-12;z>-230;z-=7){pine(-6-Math.random()*8,z,.8+Math.random()*.55);pine(6+Math.random()*8,z-3,.8+Math.random()*.55)}function lodge(x,z){const b=new THREE.Mesh(new THREE.BoxGeometry(3.5,3,3),m(0x382b32,.72));b.position.set(x,1.5,z);b.castShadow=true;world.add(b);const roof=new THREE.Mesh(new THREE.ConeGeometry(3,2.4,4),snow);roof.position.set(x,4,z);roof.rotation.y=Math.PI/4;world.add(roof);for(let yy=1;yy<3;yy+=1.1){const l=new THREE.PointLight(0xffa72b,7,9);l.position.set(x+(x<0?1.8:-1.8),yy,z);world.add(l)}}for(let z=-50;z>-220;z-=60){lodge(-11,z);lodge(11,z-25)}function waterfall(x,z){const cliff=new THREE.Mesh(new THREE.BoxGeometry(6,10,5),rock);cliff.position.set(x,5,z);world.add(cliff);const fall=new THREE.Mesh(new THREE.PlaneGeometry(2.3,9),new THREE.MeshBasicMaterial({color:0x62eaff,transparent:true,opacity:.72}));fall.position.set(x,4.7,z+2.51);world.add(fall);const glow=new THREE.PointLight(0x42eaff,20,18);glow.position.set(x,3,z+4);world.add(glow)}waterfall(-15,-82);waterfall(15,-145);const gate=new THREE.Group();for(const x of[-5,5]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,7,8),wood);p.position.set(x,3.5,0);gate.add(p)}const beam=new THREE.Mesh(new THREE.BoxGeometry(10.5,.45,.45),wood);beam.position.y=6.8;gate.add(beam);for(let x=-4;x<=4;x+=2){const l=new THREE.PointLight(0xffb32e,5,7);l.position.set(x,6.5,.4);gate.add(l)}gate.position.z=-45;world.add(gate);const rider=new THREE.Group();scene.add(rider);const sled=new THREE.Mesh(new THREE.BoxGeometry(2.7,.55,3.7),dark);sled.position.y=.65;sled.castShadow=true;rider.add(sled);for(const x of[-1,1]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.18,.15,4.2),new THREE.MeshStandardMaterial({color:0x38eaff,emissive:0x13bcd4,emissiveIntensity:3}));rail.position.set(x,.35,0);rider.add(rail)}const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.15,8,16),m(0x071a30,.35,.25));body.position.set(0,1.8,.1);rider.add(body);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.65,24,18),new THREE.MeshPhysicalMaterial({color:0x0c3153,metalness:.75,roughness:.1,clearcoat:1}));helmet.position.set(0,2.85,0);rider.add(helmet);const visor=new THREE.Mesh(new THREE.BoxGeometry(.92,.22,.07),new THREE.MeshStandardMaterial({color:0x65f5ff,emissive:0x22dfff,emissiveIntensity:4}));visor.position.set(0,2.85,.62);rider.add(visor);const engine=new THREE.PointLight(0x25eaff,22,13);engine.position.set(0,.5,1.6);rider.add(engine);const objects=[];function orb(x,z){const q=new THREE.Group(),m1=new THREE.Mesh(new THREE.TorusGeometry(.48,.12,12,28),new THREE.MeshStandardMaterial({color:0xffc51b,emissive:0xffa000,emissiveIntensity:4,metalness:.5}));m1.rotation.x=Math.PI/2;q.add(m1);q.add(new THREE.PointLight(0xffb000,10,9));q.position.set(x,1,z);q.userData={kind:'orb',hit:0};world.add(q);objects.push(q)}function ramp(x,z){const q=new THREE.Mesh(new THREE.BoxGeometry(3,.45,4.5),new THREE.MeshStandardMaterial({color:0xff7b0b,emissive:0x7d2400,emissiveIntensity:1}));q.rotation.x=-.2;q.position.set(x,.4,z);q.userData={kind:'ramp',hit:0};world.add(q);objects.push(q)}for(let z=-20;z>-260;z-=11)orb([-2.5,0,2.5][Math.floor(Math.random()*3)],z);for(let z=-38;z>-260;z-=48)ramp([-2.2,0,2.2][Math.floor(Math.random()*3)],z);const N=900,g=new THREE.BufferGeometry(),p=new Float32Array(N*3);for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*42;p[i*3+1]=Math.random()*25;p[i*3+2]=-Math.random()*190}g.setAttribute('position',new THREE.BufferAttribute(p,3));const flakes=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.1,transparent:true,opacity:.9}));scene.add(flakes);let run=0,dist=0,energy=100,orbs=0,ramps=0,coins=2450,target=0,jv=0,boost=0,sx=0;$('play').onclick=()=>{run=1;$('menu').style.display='none'};$('game').onpointerdown=e=>sx=e.clientX;$('game').onpointermove=e=>{if(e.buttons||e.pointerType==='touch'){target=THREE.MathUtils.clamp(target+(e.clientX-sx)*.018,-2.8,2.8);sx=e.clientX}};$('jump').onpointerdown=()=>{if(rider.position.y<.05)jv=.18};$('boost').onpointerdown=()=>boost=1;$('boost').onpointerup=$('boost').onpointercancel=()=>boost=0;function loop(){requestAnimationFrame(loop);if(run){const v=boost&&energy>1?.62:.34;dist+=v;energy=boost?Math.max(0,energy-.3):Math.min(100,energy+.08);rider.position.x+=(target-rider.position.x)*.11;if(jv||rider.position.y>0){rider.position.y+=jv;jv-=.012;if(rider.position.y<0){rider.position.y=0;jv=0}}world.position.z+=v;if(world.position.z>45)world.position.z=0;camera.position.x+=(rider.position.x*.28-camera.position.x)*.06;camera.lookAt(rider.position.x*.18,1.3,-12);for(const o of objects){const zz=o.position.z+world.position.z;if(o.userData.kind==='orb')o.rotation.y+=.05;if(!o.userData.hit&&Math.abs(zz)<2&&Math.abs(o.position.x-rider.position.x)<1.4){o.userData.hit=1;if(o.userData.kind==='orb'){orbs++;coins+=3}else{ramps++;jv=.2}}}const a=g.attributes.position.array;for(let i=0;i<N;i++){a[i*3+2]+=v*.75;a[i*3+1]-=.025;if(a[i*3+2]>12)a[i*3+2]-=200;if(a[i*3+1]<0)a[i*3+1]=25}g.attributes.position.needsUpdate=true;$('dist').textContent=Math.floor(dist);$('speed').textContent=Math.floor((boost?188:112)+Math.sin(performance.now()/180)*6);$('energy').textContent=Math.floor(energy);$('orbs').textContent=orbs;$('ramps').textContent=ramps;$('coins').textContent=coins}R.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})</script></body></html>
