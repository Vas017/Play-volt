<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT // FROSTBOUND</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03132d;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 5px #00152f}.top{display:flex;justify-content:space-between;padding:14px}.row{display:flex;gap:8px}.pill,.mission,.speed{background:linear-gradient(180deg,#082d57eF,#041c3deF);border:1px solid #54dfff88;box-shadow:0 7px 25px #00152faa,inset 0 0 18px #2adfff18;border-radius:18px;font-weight:900}.pill{padding:9px 13px;font-size:17px}.mission{position:absolute;left:14px;top:72px;width:188px;padding:12px;font-size:11px}.mission strong{display:block;font-size:15px;margin:5px 0}.speed{position:absolute;right:14px;top:72px;padding:10px 15px;text-align:right;font-size:10px;letter-spacing:2px}.speed strong{display:block;color:#6ef5ff;font-size:25px}.bar{height:6px;background:#173d63;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#49eaff}.controls{position:absolute;right:17px;bottom:27px;display:grid;gap:12px;pointer-events:auto}.btn{width:70px;height:70px;border-radius:50%;border:2px solid #dff;background:#123d68df;color:#fff;font-size:31px;box-shadow:0 7px 24px #00162f}.logo{position:absolute;left:18px;bottom:25px;font-weight:1000;font-style:italic;font-size:21px;letter-spacing:-1px}.logo b{color:#45eaff}.flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none}.menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;background:linear-gradient(#03152c88,#03152cdd)}.title{font-size:45px;font-weight:1000;font-style:italic;letter-spacing:-4px;text-shadow:0 5px #075a8c,0 0 30px #54eaff}.title span{color:#53eaff}.sub{font-size:12px;letter-spacing:5px;font-weight:900}.play{margin-top:25px;border:1px solid #dff;padding:17px 62px;border-radius:16px;background:linear-gradient(#6ff6ff,#25c5ec);box-shadow:0 7px #087da5,0 0 28px #44eaff88;font-size:21px;font-weight:1000;color:#05375b}.hint{position:absolute;bottom:20px;font-size:11px;opacity:.85}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud"><div class="top"><div class="pill">🪙 <span id="coins">2450</span></div><div class="row"><div class="pill">💎 <span id="gems">180</span></div><div class="pill">⚡ <span id="energy">100</span>%</div></div></div><div class="mission">FROST MISSIONS<strong>⚡ VOLT ORBS <span id="orbs">0</span>/20</strong><strong>⭐ RAMPS <span id="ramps">0</span>/5</strong><strong>🏁 <span id="dist">0</span>/3000m</strong><div class="bar"><i id="prog"></i></div></div><div class="speed">VELOCITY<strong><span id="speed">96</span> KM/H</strong></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn" id="boost">⚡</button></div><div class="logo">PLAY-<b>VOLT</b></div></div><div class="menu" id="menu"><div class="title">PLAY-<span>VOLT</span></div><div class="sub">FROSTBOUND</div><button class="play" id="play">RIDE</button><div class="hint">DRAG TO STEER · JUMP · HOLD BOOST</div></div><div class="flash" id="flash"></div><script>
const C=document.getElementById('c'),x=C.getContext('2d'),D=Math.min(devicePixelRatio,2);let W,H,run=0,t=0,px=.5,jump=0,vy=0,boost=0,energy=100,dist=0,orbs=0,ramps=0,coins=2450,gems=180,objs=[];function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);const lerp=(a,b,q)=>a+(b-a)*q,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function poly(p,fill,stroke,w=1){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=w;x.stroke()}}function glow(c,b=18){x.shadowColor=c;x.shadowBlur=b}function mountain(cx,base,s,far){let pts=[[cx-s,base]];for(let i=0;i<7;i++){let q=i/6;pts.push([cx-s+2*s*q,base-s*(.22+Math.sin(q*Math.PI)*(.62+(i%2)*.18))])}pts.push([cx+s,base]);poly(pts,far?'#174b70':'#1a5277');let peak=pts[4];poly([[peak[0],peak[1]],[peak[0]-s*.25,base-s*.28],[peak[0]+s*.2,base-s*.25]],'#dff9ffcc')}function pine(cx,cy,s){x.fillStyle='#092e42';x.fillRect(cx-2*s,cy,4*s,16*s);for(let i=0;i<3;i++)poly([[cx,cy-32*s+i*9*s],[cx-14*s+i*2*s,cy-5*s+i*7*s],[cx+14*s-i*2*s,cy-5*s+i*7*s]],i? '#0b4d60':'#126a79');x.strokeStyle='#dff';x.globalAlpha=.55;x.beginPath();x.moveTo(cx,cy-30*s);x.lineTo(cx-10*s,cy-8*s);x.stroke();x.globalAlpha=1}function cabin(cx,cy,s){x.fillStyle='#4a2c29';x.fillRect(cx-18*s,cy-18*s,36*s,25*s);poly([[cx-23*s,cy-18*s],[cx,cy-36*s],[cx+23*s,cy-18*s]],'#eefaff');x.fillStyle='#ffbd54';glow('#ff9d32',10);x.fillRect(cx-10*s,cy-10*s,7*s,7*s);x.fillRect(cx+5*s,cy-10*s,7*s,7*s);x.shadowBlur=0}function drawSky(){let g=x.createLinearGradient(0,0,0,H*.65);g.addColorStop(0,'#04162f');g.addColorStop(.45,'#075c8e');g.addColorStop(1,'#55c9e5');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<45;i++){let sx=(i*83%W),sy=(i*47%Math.max(200,H*.48));x.fillStyle=i%4?'#dff':'#7fffff';x.globalAlpha=.45+(i%5)/10;x.fillRect(sx,sy,1.5,1.5)}x.globalAlpha=1;let ag=x.createLinearGradient(0,0,W,0);ag.addColorStop(0,'#28ffd000');ag.addColorStop(.35,'#40ffd477');ag.addColorStop(.6,'#5aeaff33');ag.addColorStop(1,'#8f4fff00');x.fillStyle=ag;x.beginPath();x.moveTo(0,70);x.bezierCurveTo(W*.3,15,W*.45,160,W,40);x.lineTo(W,0);x.lineTo(0,0);x.fill();mountain(W*.18,H*.46,W*.34,1);mountain(W*.72,H*.48,W*.4,1);mountain(W*.5,H*.51,W*.28,0)}function drawWorld(){let horizon=H*.39;let snow=x.createLinearGradient(0,horizon,0,H);snow.addColorStop(0,'#dffaff');snow.addColorStop(1,'#9ddcf1');x.fillStyle=snow;x.fillRect(0,horizon,W,H-horizon);for(let i=0;i<9;i++){let z=(i*91+t*.03)%900,q=z/900,yy=lerp(horizon,H,q*q),s=lerp(.15,1.25,q);pine(W*.08+(i%2)*W*.1,yy,s);pine(W*.88-(i%3)*W*.06,yy,s)}for(let i=0;i<4;i++)cabin(W*(.14+i*.23),horizon+18+(i%2)*20,.45+(i%2)*.12);let hg=x.createLinearGradient(0,horizon,0,H);hg.addColorStop(0,'#d7fbff');hg.addColorStop(1,'#b8efff');poly([[W*.42,horizon],[W*.58,horizon],[W*.94,H],[W*.06,H]],hg);x.strokeStyle='#50ddf5';x.lineWidth=2;for(let i=0;i<10;i++){let q=((i/10+t*.00018)%1);let yy=lerp(horizon,H,q*q);let half=lerp(W*.07,W*.43,q);x.globalAlpha=.25+.55*q;x.beginPath();x.moveTo(W/2-half,yy);x.lineTo(W/2+half,yy);x.stroke()}x.globalAlpha=1;let cliffY=H*.31;x.fillStyle='#24556e';x.fillRect(W*.04,cliffY,W*.18,H*.12);let wg=x.createLinearGradient(0,cliffY,0,cliffY+H*.15);wg.addColorStop(0,'#eaffff');wg.addColorStop(.5,'#60dff5');wg.addColorStop(1,'#c8f7ff');x.fillStyle=wg;x.fillRect(W*.12,cliffY,W*.055,H*.17);glow('#61eaff',12);x.fillRect(W*.13,cliffY,W*.012,H*.17);x.shadowBlur=0}function spawn(){let type=Math.random()<.58?'orb':Math.random()<.72?'ramp':'coin';objs.push({type,z:0,lane:[-.28,0,.28][Math.floor(Math.random()*3)],hit:0})}function drawObjects(){if(run&&Math.random()<.012)spawn();for(let o of objs){o.z+=(boost?0.008:.0055);if(o.z>1.1)continue;let q=o.z,yy=lerp(H*.4,H*1.03,q*q),xx=W/2+o.lane*W*q,sz=lerp(5,42,q);if(o.type==='orb'){glow('#00eaff',18);x.fillStyle='#1eeeff';x.beginPath();x.arc(xx,yy,sz*.48,0,7);x.fill();x.fillStyle='white';x.font=`bold ${sz*.6}px Arial`;x.textAlign='center';x.fillText('⚡',xx,yy+sz*.2);x.shadowBlur=0}else if(o.type==='coin'){glow('#ffc400',16);x.fillStyle='#ffd32d';x.beginPath();x.arc(xx,yy,sz*.42,0,7);x.fill();x.strokeStyle='#fff2a1';x.lineWidth=3;x.stroke();x.shadowBlur=0}else{glow('#18dfff',15);poly([[xx-sz,yy+sz*.4],[xx+sz,yy+sz*.4],[xx+sz*.65,yy-sz*.45],[xx-sz*.65,yy-sz*.45]],'#123c68','#45f3ff',3);x.fillStyle='#75f5ff';x.font=`bold ${sz}px Arial`;x.textAlign='center';x.fillText('⌃',xx,yy+sz*.25);x.shadowBlur=0}if(!o.hit&&q>.84&&q<1.03&&Math.abs(o.lane-(px-.5)*.8)<.2){o.hit=1;if(o.type==='orb'){orbs++;energy=Math.min(100,energy+12);flash()}else if(o.type==='coin')coins++;else{ramps++;vy=-12} }}objs=objs.filter(o=>o.z<1.15&&!o.hit)}function rider(){let cx=W*px,cy=H*.79+jump;let s=Math.min(W,H)/390; x.save();x.translate(cx,cy);x.scale(s,s);glow('#19eaff',20);x.strokeStyle='#3cf5ff';x.lineWidth=7;x.beginPath();x.moveTo(-54,58);x.lineTo(-34,27);x.lineTo(34,27);x.lineTo(54,58);x.stroke();x.shadowBlur=0;let bg=x.createLinearGradient(0,-30,0,75);bg.addColorStop(0,'#173d5c');bg.addColorStop(1,'#071d36');poly([[-50,20],[-35,-8],[-18,-25],[18,-25],[35,-8],[50,20],[40,66],[-40,66]],bg,'#4deeff',2);glow('#19dfff',18);x.fillStyle='#18dcff';x.fillRect(-38,57,24,8);x.fillRect(14,57,24,8);x.shadowBlur=0;x.fillStyle='#10243c';x.beginPath();x.ellipse(0,-48,22,34,0,0,7);x.fill();x.fillStyle='#09243c';x.fillRect(-16,-82,32,35);let hg=x.createLinearGradient(-15,-100,18,-68);hg.addColorStop(0,'#eaffff');hg.addColorStop(.5,'#72cce8');hg.addColorStop(1,'#173a59');x.fillStyle=hg;x.beginPath();x.arc(0,-91,22,0,7);x.fill();glow('#2beaff',18);x.fillStyle='#3cf5ff';x.font='bold 31px Arial';x.textAlign='center';x.fillText('ϟ',0,16);if(boost){x.fillStyle='#63f7ff';poly([[-25,69],[-8,69],[-18,125]],'#5ff8ff');poly([[25,69],[8,69],[18,125]],'#5ff8ff')}x.restore();x.shadowBlur=0}function particles(){for(let i=0;i<55;i++){let q=((i*37+t*.12)%1000)/1000,yy=q*H,xx=(i*73+t*(boost?.16:.05))% (W+80)-40;x.globalAlpha=.25+.7*q;x.fillStyle='white';x.beginPath();x.arc(xx,yy,1+q*2.5,0,7);x.fill()}x.globalAlpha=1}function flash(){let f=document.getElementById('flash');f.style.opacity=.65;setTimeout(()=>f.style.opacity=0,80)}function frame(){t=performance.now();drawSky();drawWorld();drawObjects();particles();rider();if(run){dist+=boost?.24:.13;energy=clamp(energy+(boost?-.12:.025),0,100);if(energy<=0)boost=0;if(jump<0||vy<0){jump+=vy;vy+=.75;if(jump>0){jump=0;vy=0}}document.getElementById('energy').textContent=Math.ceil(energy);document.getElementById('orbs').textContent=orbs;document.getElementById('ramps').textContent=ramps;document.getElementById('dist').textContent=Math.floor(dist);document.getElementById('speed').textContent=Math.floor((boost?176:112)+Math.min(30,dist/80));document.getElementById('coins').textContent=coins;document.getElementById('prog').style.width=Math.min(100,dist/30)+'%'}requestAnimationFrame(frame)}frame();document.getElementById('play').onclick=()=>{run=1;document.getElementById('menu').style.display='none'};function steer(e){px=clamp(e.clientX/W,.23,.77)}C.onpointerdown=C.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')steer(e)};document.getElementById('jump').onclick=()=>{if(!jump)vy=-12};let B=document.getElementById('boost');B.onpointerdown=()=>{if(energy>1)boost=1};B.onpointerup=B.onpointercancel=()=>boost=0;</script></body></html>
