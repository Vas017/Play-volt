<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT: Frostbound</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061b35;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #002}.top{display:flex;justify-content:space-between;padding:10px}.group{display:flex;gap:7px}.glass{background:#052b54d9;border:1px solid #7fefff88;border-radius:17px;padding:8px 12px;font-weight:900;box-shadow:inset 0 0 16px #55eaff22,0 4px 18px #001a35aa}.mission{position:absolute;top:67px;left:10px;width:175px;font-size:11px}.mission b{display:block;font-size:15px;margin:3px 0}.bar{height:5px;background:#183e5e;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#58f1ff}.speed{position:absolute;right:10px;top:67px;text-align:right;font-size:10px;letter-spacing:2px}.speed b{display:block;font-size:24px;color:#83f8ff}.controls{position:absolute;right:13px;bottom:24px;display:grid;gap:10px;pointer-events:auto}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #dff;background:#16456ed9;color:#fff;font-size:30px;box-shadow:0 6px 20px #001a35}.menu,.over{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(circle at 50% 25%,#25a9d4,#0b4d80 38%,#04162e 78%)}.over{display:none}.logo{font-size:50px;font-weight:1000;font-style:italic;letter-spacing:-4px;text-shadow:0 5px #07527d,0 0 28px #65efff}.logo span{color:#61efff}.sub{letter-spacing:5px;font-size:11px;font-weight:800}.play{margin-top:25px;padding:17px 64px;border:0;border-radius:17px;background:linear-gradient(#91f9ff,#28c8ec);box-shadow:0 7px #087da5,0 0 30px #53efff88;color:#05375b;font-size:21px;font-weight:1000}.hint{position:absolute;bottom:20px;font-size:11px;opacity:.8}</style></head><body><div id="stage"></div><div class="hud" id="hud" style="display:none"><div class="top"><div class="glass">🪙 <span id="coins">0</span></div><div class="group"><div class="glass">💎 <span id="gems">0</span></div><div class="glass">⚡ <span id="energy">100</span>%</div></div></div><div class="glass mission">FROST MISSIONS<b>⚡ VOLT ORBS <span id="orbs">0</span>/20</b><b>⭐ RAMPS <span id="ramps">0</span>/5</b><b>🏁 <span id="dist">0</span> / 3000m</b><div class="bar"><i id="progress"></i></div></div><div class="glass speed">VELOCITY<b><span id="speed">96</span> KM/H</b></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn" id="boost">⚡</button></div></div><div class="menu" id="menu"><div class="logo">PLAY-<span>VOLT</span></div><div class="sub">FROSTBOUND EXPEDITION</div><button class="play" id="play">RIDE</button><div class="hint">DRAG TO STEER · JUMP · HOLD BOOST</div></div><div class="over" id="over"><div class="logo">RUN <span>OVER</span></div><div id="result"></div><button class="play" id="again">RIDE AGAIN</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const $=s=>document.querySelector(s),scene=new THREE.Scene();scene.background=new THREE.Color(0x78d8ef);scene.fog=new THREE.FogExp2(0xb9eff8,.008);const cam=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,500),ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.outputColorSpace=THREE.SRGBColorSpace;$('#stage').appendChild(ren.domElement);scene.add(new THREE.HemisphereLight(0xcaf8ff,0x17466d,2.2));const sun=new THREE.DirectionalLight(0xfff4d6,3);sun.position.set(-12,24,8);sun.castShadow=true;scene.add(sun);const world=new THREE.Group();scene.add(world);function mat(c,r=.8,m=.05){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const snow=mat(0xe9fbff,.95),ice=mat(0x8bdff0,.35,.08),rock=mat(0x42677a,.9),wood=mat(0x75452e,.8),cyan=new THREE.MeshStandardMaterial({color:0x25e7ff,emissive:0x12aacc,emissiveIntensity:2,metalness:.4,roughness:.25});const ground=new THREE.Mesh(new THREE.PlaneGeometry(34,700,20,100),snow);ground.rotation.x=-Math.PI/2;ground.position.z=-300;ground.receiveShadow=true;world.add(ground);const track=new THREE.Mesh(new THREE.PlaneGeometry(10,700,10,100),ice);track.rotation.x=-Math.PI/2;track.position.set(0,.025,-300);track.receiveShadow=true;world.add(track);function mountain(x,z,s){const m=new THREE.Mesh(new THREE.ConeGeometry(s,s*1.7,6),rock);m.position.set(x,s*.82,z);m.rotation.y=Math.random();m.castShadow=true;world.add(m);const cap=new THREE.Mesh(new THREE.ConeGeometry(s*.62,s*.72,6),snow);cap.position.set(x,s*1.42,z);cap.rotation.y=m.rotation.y;world.add(cap)}for(let z=-35;z>-620;z-=28){mountain(-18-Math.random()*16,z,6+Math.random()*8);mountain(18+Math.random()*16,z,6+Math.random()*8)}function pine(x,z,s=1){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,1.4,6),wood);tr.position.set(x,.7,z);world.add(tr);for(let y=1;y<3;y++){const p=new THREE.Mesh(new THREE.ConeGeometry((1.25-y*.2)*s,1.8*s,7),mat(0x0c6072,.8));p.position.set(x,.7+y*.65*s,z);p.castShadow=true;world.add(p)}}for(let z=-15;z>-600;z-=10){pine(-8-Math.random()*7,z,.7+Math.random()*.7);pine(8+Math.random()*7,z,.7+Math.random()*.7)}function cabin(x,z){const b=new THREE.Mesh(new THREE.BoxGeometry(3,2,3),wood);b.position.set(x,1,z);b.castShadow=true;world.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(2.5,1.6,4),mat(0xf1fbff));r.position.set(x,2.6,z);r.rotation.y=Math.PI/4;world.add(r);const w=new THREE.Mesh(new THREE.PlaneGeometry(.7,.65),new THREE.MeshBasicMaterial({color:0xffd36b}));w.position.set(x-.65,1.15,z+1.51);world.add(w)}for(let z=-60;z>-550;z-=95){cabin(-12,z);cabin(13,z-25)}function waterfall(x,z){const cliff=new THREE.Mesh(new THREE.BoxGeometry(7,9,4),rock);cliff.position.set(x,4.5,z);world.add(cliff);const fall=new THREE.Mesh(new THREE.PlaneGeometry(2.1,8),new THREE.MeshStandardMaterial({color:0x80efff,transparent:true,opacity:.8,emissive:0x1a8fac,emissiveIntensity:.8}));fall.position.set(x,4.2,z+2.03);world.add(fall)}waterfall(-15,-145);waterfall(16,-360);const sled=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.55,3.1),mat(0x0b416a,.25,.55));body.position.y=.75;body.castShadow=true;sled.add(body);const nose=new THREE.Mesh(new THREE.ConeGeometry(1.15,2.2,4),mat(0x178fc1,.2,.5));nose.rotation.x=Math.PI/2;nose.rotation.z=Math.PI/4;nose.position.set(0,.8,-2);sled.add(nose);const rider=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.1,5,8),mat(0x173451,.5));rider.position.set(0,1.65,.25);rider.rotation.x=-.25;sled.add(rider);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),mat(0xeefcff,.2,.3));helmet.position.set(0,2.5,-.1);sled.add(helmet);for(const x of[-.82,.82]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.16,.13,3.7),cyan);rail.position.set(x,.4,.1);sled.add(rail)}scene.add(sled);cam.position.set(0,5.5,9);cam.lookAt(0,1,-10);let run=0,last=0,distance=0,energy=100,coins=0,gems=0,orbs=0,ramps=0,boosting=0,vy=0,items=[],flakes=[];const geo=new THREE.SphereGeometry(.06,5,4),fm=new THREE.MeshBasicMaterial({color:0xffffff});for(let i=0;i<160;i++){const f=new THREE.Mesh(geo,fm);f.position.set((Math.random()-.5)*30,Math.random()*16,-Math.random()*90);scene.add(f);flakes.push(f)}function spawn(type,z){let mesh;if(type==='orb'){mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,1),cyan)}else if(type==='coin'){mesh=new THREE.Mesh(new THREE.TorusGeometry(.48,.14,8,16),new THREE.MeshStandardMaterial({color:0xffcf31,emissive:0xa86a00,emissiveIntensity:.7,metalness:.7}))}else if(type==='ramp'){mesh=new THREE.Mesh(new THREE.BoxGeometry(2.6,.25,2.4),cyan);mesh.rotation.x=-.2}else{mesh=new THREE.Mesh(new THREE.DodecahedronGeometry(.9),rock)}mesh.position.set([-2.7,0,2.7][Math.floor(Math.random()*3)],type==='orb'||type==='coin'?1.15:.5,z);mesh.castShadow=true;scene.add(mesh);items.push({type,mesh,hit:false})}function resetItems(){items.forEach(o=>scene.remove(o.mesh));items=[];for(let z=-28;z>-600;z-=12+Math.random()*8){let r=Math.random();spawn(r<.42?'orb':r<.62?'coin':r<.78?'ramp':'rock',z)}}resetItems();function start(){run=1;distance=coins=gems=orbs=ramps=0;energy=100;vy=0;sled.position.set(0,0,0);resetItems();$('#menu').style.display='none';$('#over').style.display='none';$('#hud').style.display='block';last=performance.now();requestAnimationFrame(loop)}$('#play').onclick=$('#again').onclick=start;function steer(e){if(!run)return;let x=(e.clientX/innerWidth-.5)*9;sled.position.x=THREE.MathUtils.clamp(x,-4.2,4.2)}ren.domElement.onpointerdown=ren.domElement.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')steer(e)};$('#jump').onclick=()=>{if(sled.position.y<.05)vy=.17};$('#boost').onpointerdown=()=>boosting=1;$('#boost').onpointerup=$('#boost').onpointercancel=()=>boosting=0;function end(){run=0;boosting=0;$('#hud').style.display='none';$('#result').textContent=Math.floor(distance)+' m · ⚡ '+orbs+' · 🪙 '+coins;$('#over').style.display='flex'}function loop(t){if(!run)return;let dt=Math.min(2,(t-last)/16.67);last=t;if(boosting&&energy>0)energy-=.35*dt;else energy=Math.min(100,energy+.08*dt);if(energy<=0)boosting=0;let speed=(boosting?1.25:.72)+Math.min(.3,distance/5000);distance+=speed*.8*dt;world.position.z+=speed*dt;for(const o of items){o.mesh.position.z+=speed*dt;o.mesh.rotation.y+=.03*dt;if(!o.hit&&o.mesh.position.z>-2&&o.mesh.position.z<2&&Math.abs(o.mesh.position.x-sled.position.x)<1.2){if(o.type==='orb'){orbs++;energy=Math.min(100,energy+8);o.hit=true;o.mesh.visible=false}else if(o.type==='coin'){coins++;if(coins%10===0)gems++;o.hit=true;o.mesh.visible=false}else if(o.type==='ramp'){vy=.22;ramps++;o.hit=true}else if(sled.position.y<.75){end();return}}}if(vy||sled.position.y>0){sled.position.y+=vy*dt;vy-=.012*dt;if(sled.position.y<0){sled.position.y=0;vy=0}}sled.rotation.z+=( -sled.position.x*.035-sled.rotation.z)*.08;for(const f of flakes){f.position.z+=speed*(boosting?2.5:1)*dt;f.position.y-=.03*dt;if(f.position.z>10||f.position.y<0){f.position.z=-80-Math.random()*40;f.position.y=5+Math.random()*12;f.position.x=(Math.random()-.5)*30}}cam.position.x+=(sled.position.x*.28-cam.position.x)*.06;$('#coins').textContent=coins;$('#gems').textContent=gems;$('#energy').textContent=Math.ceil(energy);$('#orbs').textContent=orbs;$('#ramps').textContent=ramps;$('#dist').textContent=Math.floor(distance);$('#progress').style.width=Math.min(100,distance/30)+'%';$('#speed').textContent=Math.floor(88+speed*55);ren.render(scene,cam);requestAnimationFrame(loop)}ren.render(scene,cam);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)})
</script></body></html>
