<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT // NEON RUN</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030d;font-family:system-ui,Arial;color:#fff;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.glass{background:#07152bbb;border:1px solid #35eaff66;backdrop-filter:blur(9px);box-shadow:0 0 22px #00d9ff20;border-radius:16px;padding:8px 12px}.stats{display:flex;gap:7px}.speed{position:absolute;right:14px;top:72px;text-align:right;font-size:11px;letter-spacing:2px}.speed b{display:block;font-size:27px;color:#62f4ff}.mission{position:absolute;left:12px;top:72px;width:150px;font-size:11px}.mission b{font-size:18px}.bar{height:4px;background:#18314c;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#55f6ff;box-shadow:0 0 10px #22eaff}.controls{position:absolute;bottom:25px;right:14px;display:flex;gap:10px;pointer-events:auto}.btn{width:64px;height:64px;border-radius:50%;border:1px solid #79f7ff99;background:#061a35cc;color:white;font-size:25px;box-shadow:0 0 24px #00ddff33}.btn:active{transform:scale(.94);background:#0d5273}.menu,.over{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 38%,#092b58 0,#030717 45%,#01030a 100%)}.over{display:none}.eyebrow{font-size:11px;letter-spacing:6px;color:#68f4ff}.logo{font-size:52px;font-weight:950;font-style:italic;letter-spacing:-4px}.logo span{color:#4eeaff;text-shadow:0 0 30px #00dfff}.sub{letter-spacing:5px;font-size:11px;opacity:.75}.play{margin-top:25px;border:1px solid #83f8ff;background:linear-gradient(120deg,#22cbea,#8c6cff);color:white;font-weight:900;font-size:20px;padding:17px 65px;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);box-shadow:0 0 35px #20eaff55}.hint{position:absolute;bottom:20px;font-size:11px;opacity:.6}.over h2{font-size:38px;margin:8px}.danger{color:#ff3e8b}</style></head><body><canvas id="c"></canvas><div class="hud" id="hud" style="display:none"><div class="top"><div class="glass">⚡ <b id="energy">100</b>%</div><div class="stats"><div class="glass">◈ <b id="score">0</b></div><div class="glass">COMBO <b id="combo">x1</b></div></div></div><div class="glass mission">SECTOR OBJECTIVE<br><b>ENERGY GATES <span id="gates">0</span>/12</b><div class="bar"><i id="progress"></i></div></div><div class="glass speed">VELOCITY<b><span id="speed">320</span> KM/H</b></div><div class="controls"><button class="btn" id="jump">↟</button><button class="btn" id="boost">⚡</button></div></div><div class="menu" id="menu"><div class="eyebrow">NEURAL RACE PROTOCOL</div><div class="logo">PLAY-<span>VOLT</span></div><div class="sub">NEON RUN // SECTOR 01</div><button class="play" id="play">ENTER GRID</button><div class="hint">DRAG TO STEER · JUMP · HOLD BOOST · SURVIVE</div></div><div class="over" id="over"><div class="eyebrow danger">VEHICLE SIGNAL LOST</div><h2>RUN TERMINATED</h2><div id="result"></div><button class="play" id="again">REBOOT</button></div><script>
const C=document.querySelector('#c'),x=C.getContext('2d');let W,H,D,run=0,last=0,z=0,vz=0,px=0,road=0,vel=11,energy=100,boosting=0,scoreN=0,gatesN=0,comboN=1,spawn=0,items=[],particles=[];function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0);px=W/2}onresize=resize;resize();
function poly(p,fill,stroke){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}function bg(t){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020318');g.addColorStop(.52,'#071b38');g.addColorStop(1,'#02030b');x.fillStyle=g;x.fillRect(0,0,W,H);let hz=H*.31;x.fillStyle='#31134a';x.beginPath();x.arc(W*.73,hz*.56,70,0,7);x.fill();x.fillStyle='#fa3b9b';x.beginPath();x.arc(W*.73,hz*.56,53,0,7);x.fill();for(let i=0;i<34;i++){let xx=(i*97)%W,yy=(i*53)%hz;x.fillStyle=i%5?'#7defff':'#ff65d0';x.fillRect(xx,yy,1.5,1.5)}for(let side of[-1,1])for(let i=0;i<7;i++){let bx=W/2+side*(80+i*65);let bh=35+(i*43)%120;x.fillStyle='#061127';x.fillRect(bx-28,hz-bh,55,bh);x.fillStyle=i%2?'#13dffc':'#ff2f99';for(let q=8;q<bh;q+=14)x.fillRect(bx-18,hz-q,3,5)}let curve=Math.sin(road*.006)*W*.12,top=W/2+curve;poly([[0,H],[top-W*.09,hz],[top+W*.09,hz],[W,H]],'#080b18');for(let i=0;i<3;i++){let q=((i/3+road*.012)%1),yy=hz+(H-hz)*q*q,half=35+(W*.52)*q;x.strokeStyle='#19e9ff';x.globalAlpha=.25+.7*q;x.lineWidth=1+q*3;x.beginPath();x.moveTo(W/2-half+curve*(1-q),yy);x.lineTo(W/2+half+curve*(1-q),yy);x.stroke()}x.globalAlpha=1;x.strokeStyle='#ff38b5';x.lineWidth=4;x.beginPath();x.moveTo(top-W*.09,hz);x.lineTo(0,H);x.stroke();x.strokeStyle='#2beeff';x.beginPath();x.moveTo(top+W*.09,hz);x.lineTo(W,H);x.stroke();if(boosting){for(let i=0;i<18;i++){let sx=(i*73+t*.8)%W;x.strokeStyle=i%2?'#35edff55':'#ff42bd44';x.beginPath();x.moveTo(sx,H*.2);x.lineTo(sx+(sx-W/2)*.25,H);x.stroke()}}}
function add(){let type=Math.random()<.58?'gate':'drone',lane=[-.25,0,.25][Math.floor(Math.random()*3)];items.push({type,lane,q:0})}function project(o){let q=o.q,yy=H*.31+(H*.78)*q*q,center=W/2+Math.sin(road*.006)*W*.12*(1-q),xx=center+o.lane*W*q*1.35,s=.2+q*1.25;return[xx,yy,s]}function obj(o){let [xx,yy,s]=project(o);x.save();x.translate(xx,yy);x.scale(s,s);if(o.type==='gate'){x.shadowBlur=20;x.shadowColor='#25efff';x.strokeStyle='#40f3ff';x.lineWidth=4;x.beginPath();x.moveTo(-35,28);x.lineTo(-35,-28);x.lineTo(0,-48);x.lineTo(35,-28);x.lineTo(35,28);x.stroke();x.strokeStyle='#ff43bd';x.lineWidth=2;x.strokeRect(-22,-25,44,3)}else{x.shadowBlur=18;x.shadowColor='#ff2d86';poly([[-28,20],[-38,-8],[-15,-25],[0,-12],[15,-25],[38,-8],[28,20]],'#29102d','#ff3c91');x.fillStyle='#ffda3e';x.fillRect(-12,-3,24,5)}x.restore()}function ship(){let y=H*.78-z;x.save();x.translate(px,y);x.shadowBlur=boosting?38:20;x.shadowColor=boosting?'#43f7ff':'#8b6cff';poly([[-46,25],[-29,-12],[-12,-25],[0,-13],[12,-25],[29,-12],[46,25],[18,17],[0,31],[-18,17]],'#10192d','#5defff');poly([[-19,11],[0,-22],[19,11],[0,20]],'#3d61a5','#ff55c8');x.fillStyle='#63f6ff';x.fillRect(-37,25,19,5);x.fillRect(18,25,19,5);if(boosting){x.fillStyle='#b6fbff';poly([[-32,30],[-20,30],[-26,82]],'#54ecff');poly([[20,30],[32,30],[26,82]],'#ff4ec4')}x.restore()}
function start(){run=1;road=scoreN=gatesN=0;energy=100;comboN=1;items=[];px=W/2;z=vz=0;menu.style.display='none';over.style.display='none';hud.style.display='block';last=performance.now();requestAnimationFrame(loop)}play.onclick=again.onclick=start;C.onpointerdown=C.onpointermove=e=>{if(run&&(e.buttons||e.pointerType==='touch'))px=Math.max(45,Math.min(W-45,e.clientX))};jump.onclick=()=>{if(!z){vz=13}};boost.onpointerdown=()=>boosting=1;boost.onpointerup=boost.onpointercancel=()=>boosting=0;function end(){run=0;boosting=0;hud.style.display='none';result.innerHTML=`SCORE <b>${Math.floor(scoreN)}</b> &nbsp; // &nbsp; GATES <b>${gatesN}</b>`;over.style.display='flex'}
function loop(t){if(!run)return;let dt=Math.min(2,(t-last)/16.7);last=t;if(boosting&&energy>0)energy-=.35*dt;else energy=Math.min(100,energy+.08*dt);if(energy<=0)boosting=0;vel=11+(boosting?8:0)+Math.min(6,scoreN/2000);road+=vel*dt;scoreN+=vel*.09*comboN*dt;if(z||vz){z+=vz*dt;vz-=.72*dt;if(z<0)z=vz=0}spawn-=dt;if(spawn<=0){add();spawn=32+Math.random()*24}bg(t);for(let i=items.length-1;i>=0;i--){let o=items[i];o.q+=.0085*vel*dt;obj(o);if(o.q>.79&&o.q<.94){let [xx]=project(o);if(Math.abs(px-xx)<46){if(o.type==='gate'){gatesN++;comboN=Math.min(5,comboN+.25);scoreN+=150;items.splice(i,1);continue}else if(z<35){end();return}}}if(o.q>1.08){if(o.type==='gate')comboN=1;items.splice(i,1)}}ship();energyEl.textContent=Math.ceil(energy);scoreEl.textContent=Math.floor(scoreN);comboEl.textContent='x'+comboN.toFixed(comboN%1?1:0);gates.textContent=gatesN;progress.style.width=Math.min(100,gatesN/12*100)+'%';speedEl.textContent=Math.floor(320+vel*23);requestAnimationFrame(loop)}const energyEl=document.querySelector('#energy'),scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),speedEl=document.querySelector('#speed');bg(0);
</script></body></html>
