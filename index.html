<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03142d;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #001}.top{display:flex;justify-content:flex-end;gap:7px;padding:10px;font-weight:900}.pill{background:#082d5ee8;border:1px solid #42ddff77;border-radius:16px;padding:8px 10px}.distance{position:absolute;top:70px;left:12px;background:#061d43dc;border-radius:14px;padding:10px 14px;font-size:13px}.distance b{display:block;font-size:27px}.missions{position:absolute;top:142px;left:10px;width:155px}.mission{font-size:11px;margin:7px 0;background:#071d42e8;padding:8px;border-radius:11px}.bar{height:5px;background:#284064;border-radius:5px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#21ddff}.controls{position:absolute;right:13px;bottom:24px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}.btn{width:67px;height:67px;border-radius:50%;border:2px solid #c9efff;background:#17355ee8;color:white;font-size:29px;font-weight:bold;box-shadow:0 4px 12px #0008}.boost{color:#4feaff}.menu,.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;background:radial-gradient(circle at 50% 20%,#126ca5,#03142df5 66%);z-index:5}.logo{font-size:50px;font-weight:1000;font-style:italic;letter-spacing:-4px;text-shadow:0 6px 0 #001b36}.logo b{color:#34ddff;text-shadow:0 0 20px #21dfff}.menu p{font-weight:bold;letter-spacing:3px}.play{pointer-events:auto;border:0;border-radius:18px;padding:18px 65px;font-size:26px;font-weight:900;color:#052542;background:#51e4ff;box-shadow:0 7px 0 #087da6}.hint{position:absolute;bottom:18px;font-size:12px;opacity:.85}.over{display:none;background:#03142eef}.over h2{font-size:42px;margin:0 0 10px}.stats{font-size:19px;margin-bottom:20px}.pause{pointer-events:auto;font-size:23px;padding:5px 10px}</style></head>
<body><canvas id="c"></canvas>
<div class="ui" id="ui" style="display:none"><div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">💎 <span id="gems">0</span></div><div class="pill">⚡ <span id="energy">5</span></div><div class="pill pause" id="pause">Ⅱ</div></div><div class="distance">DISTANCE<b><span id="dist">0</span> m</b>👑 Best <span id="best">0</span> m</div><div class="missions"><div class="mission">⚡ Collect 20 Volt Orbs <b id="orbtxt">0/20</b><div class="bar"><i id="orbbar"></i></div></div><div class="mission">⭐ Perform 5 Tricks <b id="jumptxt">0/5</b><div class="bar"><i id="jumpbar"></i></div></div><div class="mission">🏁 Reach 3,000 m<div class="bar"><i id="distbar"></i></div></div></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn boost" id="boost">⚡</button><button class="btn" id="trick">◒</button></div></div>
<div class="menu" id="menu"><div class="logo">PLAY-<b>VOLT</b></div><p>RIDE • BOOST • SURVIVE</p><button class="play" id="play">PLAY</button><div class="hint">Drag left & right to steer • jump • boost • dodge</div></div><div class="over" id="over"><h2>RUN OVER</h2><div class="stats" id="stats"></div><button class="play" id="again">RIDE AGAIN</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,playing=false,paused=false,last=0,dist=0,coins=0,gems=0,orbs=0,jumps=0,energy=5,speed=9,boosting=false,spawn=0,orbSpawn=0,objs=[],stars=[],best=+(localStorage.pvbest||0);const p={x:0,y:0,z:0,vz:0,w:58,h:72,tilt:0};
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);p.y=H-150;p.x=p.x||W/2;stars=Array.from({length:42},(_,i)=>({x:(i*137)%W,y:(i*83)%H*.55,r:1+i%3*.45}))}addEventListener('resize',resize);resize();
function start(){playing=true;paused=false;dist=coins=gems=orbs=jumps=0;energy=5;speed=9;boosting=false;objs=[];p.x=W/2;p.z=p.vz=0;menu.style.display='none';over.style.display='none';ui.style.display='block';last=performance.now();requestAnimationFrame(loop)}play.onclick=start;again.onclick=start;pause.onclick=()=>{paused=!paused;if(!paused){last=performance.now();requestAnimationFrame(loop)}};
function steer(v){if(playing&&!paused)p.x=Math.max(50,Math.min(W-50,v))}c.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')steer(e.clientX)};c.onpointerdown=e=>steer(e.clientX);
function doJump(){if(playing&&!paused&&p.z===0){p.vz=14;jumps++}}jump.onclick=doJump;trick.onclick=()=>{if(p.z>12){p.tilt+=Math.PI*2;jumps++}else doJump()};boost.onpointerdown=()=>{if(energy>0)boosting=true};boost.onpointerup=boost.onpointercancel=()=>boosting=false;
function add(type){let lanes=[W*.25,W*.5,W*.75];objs.push({type,x:lanes[Math.floor(Math.random()*3)]+(Math.random()-.5)*30,y:H*.39,r:type==='orb'?17:30+Math.random()*10})}
function mountain(a,b,mx,top){ctx.fillStyle='#9dddf5';ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(mx,top);ctx.lineTo(mx+(mx-a),b);ctx.fill();ctx.fillStyle='#eefbff';ctx.beginPath();ctx.moveTo(mx,top);ctx.lineTo(mx+(mx-a),b);ctx.lineTo(mx+12,b);ctx.fill()}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03122d');g.addColorStop(.27,'#07518a');g.addColorStop(.49,'#20a2cc');g.addColorStop(1,'#e7faff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#23e9d91c';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(W*.25,H*.17,W*.58,0);ctx.lineTo(W,0);ctx.lineTo(W,H*.12);ctx.quadraticCurveTo(W*.55,H*.02,0,H*.23);ctx.fill();ctx.fillStyle='#d9efff';ctx.beginPath();ctx.arc(W*.77,H*.105,25,0,7);ctx.fill();for(const s of stars){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,(s.y+dist*2)%Math.max(1,H*.43),s.r,0,7);ctx.fill()}let horizon=H*.42;mountain(-20,horizon,W*.16,H*.25);mountain(W*.12,horizon,W*.48,H*.17);mountain(W*.53,horizon,W*.8,H*.23);ctx.fillStyle='#eafaff';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#aee6f6';ctx.beginPath();ctx.moveTo(W*.08,H);ctx.lineTo(W*.42,horizon);ctx.lineTo(W*.58,horizon);ctx.lineTo(W*.92,H);ctx.fill();ctx.strokeStyle='#66dfff';ctx.lineWidth=2;for(let i=0;i<7;i++){let q=((i/7+dist*.006)%1);let yy=horizon+(H-horizon)*q*q;let half=(W*.08)+(W*.4)*q;ctx.beginPath();ctx.moveTo(W/2-half,yy);ctx.lineTo(W/2+half,yy);ctx.stroke()}}
function drawObj(o){let scale=.45+(o.y-H*.4)/(H*.7);scale=Math.max(.4,Math.min(1.25,scale));if(o.type==='orb'){ctx.save();ctx.shadowBlur=24;ctx.shadowColor='#1eeaff';ctx.fillStyle='#18dcff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*scale,0,7);ctx.fill();ctx.fillStyle='white';ctx.font=`bold ${20*scale}px Arial`;ctx.textAlign='center';ctx.fillText('⚡',o.x,o.y+7*scale);ctx.restore()}else{ctx.save();ctx.translate(o.x,o.y);ctx.scale(scale,scale);ctx.fillStyle='#15384f';ctx.beginPath();ctx.moveTo(-32,25);ctx.lineTo(-23,-20);ctx.lineTo(5,-34);ctx.lineTo(34,7);ctx.lineTo(20,31);ctx.fill();ctx.strokeStyle='#58dfff';ctx.lineWidth=3;ctx.stroke();ctx.restore()}}
function rider(){let y=p.y-p.z;ctx.save();ctx.translate(p.x,y);if(p.tilt){p.tilt*=.86;ctx.rotate(p.tilt)}ctx.shadowBlur=boosting?30:13;ctx.shadowColor='#24dfff';ctx.fillStyle='#13243c';ctx.fillRect(-31,18,62,24);ctx.fillStyle='#2be6ff';ctx.fillRect(-29,35,18,7);ctx.fillRect(11,35,18,7);if(boosting){ctx.fillStyle='#71f5ff';for(let s of[-18,13]){ctx.beginPath();ctx.moveTo(s,42);ctx.lineTo(s+7,82);ctx.lineTo(s+15,42);ctx.fill()}}ctx.fillStyle='#0c1e35';ctx.fillRect(-23,-14,46,37);ctx.strokeStyle='#2ce8ff';ctx.lineWidth=3;ctx.strokeRect(-23,-14,46,37);ctx.fillStyle='#23e9ff';ctx.font='bold 25px Arial';ctx.textAlign='center';ctx.fillText('⚡',0,15);ctx.fillStyle='#eef7ff';ctx.beginPath();ctx.arc(0,-28,16,0,7);ctx.fill();ctx.fillStyle='#0c203b';ctx.fillRect(-17,-35,34,11);ctx.restore()}
function hit(o){return p.z<28&&Math.abs(p.x-o.x)<42&&Math.abs(p.y-o.y)<48}function hud(){distEl.textContent=Math.floor(dist);coinsEl.textContent=coins;gemsEl.textContent=gems;energyEl.textContent=Math.ceil(energy);bestEl.textContent=Math.max(best,Math.floor(dist));orbtxt.textContent=orbs+'/20';jumptxt.textContent=Math.min(jumps,5)+'/5';orbbar.style.width=Math.min(100,orbs*5)+'%';jumpbar.style.width=Math.min(100,jumps*20)+'%';distbar.style.width=Math.min(100,dist/30)+'%'}
const distEl=dist,coinsEl=coins,gemsEl=gems,energyEl=energy,bestEl=best;function end(){playing=false;boosting=false;best=Math.max(best,Math.floor(dist));localStorage.pvbest=best;ui.style.display='none';stats.textContent='Distance '+Math.floor(dist)+'m • ⚡ '+orbs+' • 🪙 '+coins;over.style.display='flex'}
function loop(t){if(!playing||paused)return;let dt=Math.min(2,(t-last)/16.67);last=t;if(boosting&&energy>0){energy-=.018*dt;if(energy<=0){energy=0;boosting=false}}else energy=Math.min(5,energy+.003*dt);speed=Math.min(19,9+dist/650)+(boosting?6:0);dist+=speed*.11*dt;spawn-=dt;orbSpawn-=dt;if(spawn<=0){add('rock');spawn=48+Math.random()*45}if(orbSpawn<=0){add('orb');orbSpawn=24+Math.random()*28}if(p.z>0||p.vz>0){p.z+=p.vz*dt;p.vz-=.76*dt;if(p.z<0){p.z=0;p.vz=0}}background();for(let i=objs.length-1;i>=0;i--){let o=objs[i];o.y+=speed*1.05*dt;drawObj(o);if(hit(o)){if(o.type==='orb'){orbs++;coins+=10;if(orbs%6===0)gems++;energy=Math.min(5,energy+.5);objs.splice(i,1);continue}else{end();return}}if(o.y>H+80)objs.splice(i,1)}rider();hud();requestAnimationFrame(loop)}background();
</script></body></html>
