<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06162f;font-family:Arial,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #001}.top{display:flex;justify-content:space-between;padding:14px 14px;font-weight:900;font-size:18px}.pill{background:#092d5dcc;border:1px solid #38dfff88;border-radius:16px;padding:9px 12px;box-shadow:inset 0 0 16px #16cfff33}.missions{position:absolute;top:72px;left:12px;width:155px}.mission{font-size:12px;margin:7px 0;background:#071d42d9;padding:8px;border-radius:12px}.bar{height:5px;background:#243d63;border-radius:5px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#27dfff}.controls{position:absolute;right:14px;bottom:28px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}.btn{width:66px;height:66px;border-radius:50%;border:2px solid #b9e9ff;background:#17345fd9;color:white;font-size:30px;font-weight:bold;box-shadow:0 4px 12px #0008}.boost{color:#4fe8ff}.jump{font-size:35px}.menu,.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;background:radial-gradient(circle at 50% 25%,#1171a8aa,#03142cf2 65%);z-index:5}.logo{font-size:52px;font-weight:1000;font-style:italic;letter-spacing:-4px}.logo b{color:#36dcff;text-shadow:0 0 18px #1edcff}.menu p{font-weight:bold;letter-spacing:3px}.play{pointer-events:auto;border:0;border-radius:18px;padding:18px 65px;font-size:26px;font-weight:900;color:#052542;background:#51e4ff;box-shadow:0 7px 0 #087da6}.hint{position:absolute;bottom:20px;font-size:12px;opacity:.8}.over{display:none;background:#03142eea}.over h2{font-size:44px;margin:0 0 10px}.stats{font-size:20px;margin-bottom:20px}</style></head><body><canvas id="c"></canvas><div class="ui" id="ui" style="display:none"><div class="top"><div class="pill">🪙 <span id="coins">0</span> &nbsp; 💎 <span id="gems">0</span></div><div class="pill">⚡ <span id="energy">5</span> &nbsp; <span id="dist">0</span>m</div></div><div class="missions"><div class="mission">⚡ Collect 20 Volt Orbs <b id="orbtxt">0/20</b><div class="bar"><i id="orbbar" style="width:0%"></i></div></div><div class="mission">⭐ Perform 5 jumps <b id="jumptxt">0/5</b><div class="bar"><i id="jumpbar" style="width:0%"></i></div></div></div><div class="controls"><button class="btn jump" id="jump">↑</button><button class="btn boost" id="boost">⚡</button></div></div><div class="menu" id="menu"><div class="logo">PLAY-<b>VOLT</b></div><p>RIDE • BOOST • SURVIVE</p><button class="play" id="play">PLAY</button><div class="hint">Drag left & right to steer • collect ⚡ • dodge obstacles</div></div><div class="over" id="over"><h2>RUN OVER</h2><div class="stats" id="stats"></div><button class="play" id="again">RIDE AGAIN</button></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,playing=false,last=0,dist=0,coins=0,gems=0,orbs=0,jumps=0,speed=8,boost=0,spawn=0,orbSpawn=0,objs=[],particles=[];const p={x:0,y:0,w:58,h:76,z:0,vz:0};function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);p.y=H-145;if(!playing)p.x=W/2}addEventListener('resize',resize);resize();function start(){playing=true;dist=coins=gems=orbs=jumps=0;speed=8;boost=0;objs=[];particles=[];p.x=W/2;p.z=p.vz=0;menu.style.display='none';over.style.display='none';ui.style.display='block';last=performance.now();requestAnimationFrame(loop)}play.onclick=start;again.onclick=start;function steer(v){if(playing)p.x=Math.max(45,Math.min(W-45,v))}c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')steer(e.clientX)});c.addEventListener('pointerdown',e=>steer(e.clientX));function doJump(){if(playing&&p.z===0){p.vz=13;jumps++;}}jump.onclick=doJump;boost.onpointerdown=()=>{if(playing)boost=1};boost.onpointerup=()=>boost=0;boost.onpointercancel=()=>boost=0;function addObj(type){objs.push({type,x:45+Math.random()*(W-90),y:-80,r:type==='orb'?18:30+Math.random()*10})}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04122d');g.addColorStop(.36,'#075c94');g.addColorStop(.55,'#21a8cf');g.addColorStop(1,'#d9f7ff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#2ce7d522';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(W*.3,H*.15,W*.55,0);x.lineTo(W*.9,0);x.quadraticCurveTo(W*.55,H*.25,0,H*.18);x.fill();mount(0,H*.43,W*.22,H*.2);mount(W*.18,H*.43,W*.52,H*.16);mount(W*.55,H*.43,W*.88,H*.22);x.fillStyle='#dff9ff';x.fillRect(0,H*.43,W,H*.57);x.fillStyle='#a7e9ff';x.beginPath();x.moveTo(W*.12,H);x.lineTo(W*.43,H*.43);x.lineTo(W*.57,H*.43);x.lineTo(W*.88,H);x.fill();for(let i=0;i<24;i++){let yy=(i*79+dist*4)%H,xx=(i*137%W);x.fillStyle='#fff';x.beginPath();x.arc(xx,yy,1.5+(i%3),0,7);x.fill()}}function mount(a,b,cx,top){x.fillStyle='#bcecff';x.beginPath();x.moveTo(a,b);x.lineTo((a+cx)/2,top);x.lineTo(cx,b);x.fill();x.fillStyle='#effcff';x.beginPath();x.moveTo((a+cx)/2,top);x.lineTo(cx,b);x.lineTo((a+cx)*.53,b);x.fill()}function drawObj(o){if(o.type==='orb'){x.save();x.shadowBlur=22;x.shadowColor='#24e9ff';x.fillStyle='#1fe7ff';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.fillStyle='white';x.font='bold 20px Arial';x.textAlign='center';x.fillText('⚡',o.x,o.y+7);x.restore()}else{x.fillStyle='#173a51';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.fillStyle='#8fdcff';x.beginPath();x.arc(o.x-o.r*.25,o.y-o.r*.25,o.r*.3,0,7);x.fill()}}function rider(){let yy=p.y-p.z;x.save();x.translate(p.x,yy);x.shadowBlur=boost?28:12;x.shadowColor='#22dfff';x.fillStyle='#101d2f';x.fillRect(-28,18,56,22);x.fillStyle='#2cdfff';x.fillRect(-25,34,18,7);x.fillRect(7,34,18,7);if(boost){x.fillStyle='#5ff4ff';x.beginPath();x.moveTo(-18,42);x.lineTo(-7,72);x.lineTo(0,42);x.fill();x.beginPath();x.moveTo(7,42);x.lineTo(18,72);x.lineTo(24,42);x.fill()}x.fillStyle='#0c2441';x.fillRect(-22,-12,44,35);x.strokeStyle='#2deaff';x.lineWidth=3;x.strokeRect(-22,-12,44,35);x.fillStyle='#1fe7ff';x.font='bold 25px Arial';x.textAlign='center';x.fillText('⚡',0,15);x.fillStyle='#e8f4ff';x.beginPath();x.arc(0,-25,15,0,7);x.fill();x.fillStyle='#10213b';x.fillRect(-16,-31,32,10);x.restore()}function hit(o){return p.z<25&&Math.abs(p.x-o.x)<p.w/2+o.r*.65&&Math.abs(p.y-o.y)<p.h/2+o.r*.55}function updateHud(){distEl.textContent=Math.floor(dist);coinsEl.textContent=coins;gemsEl.textContent=gems;orbtxt.textContent=orbs+'/20';jumptxt.textContent=Math.min(jumps,5)+'/5';orbbar.style.width=Math.min(100,orbs*5)+'%';jumpbar.style.width=Math.min(100,jumps*20)+'%'}const distEl=document.getElementById('dist'),coinsEl=document.getElementById('coins'),gemsEl=document.getElementById('gems');function end(){playing=false;ui.style.display='none';stats.textContent='Distance '+Math.floor(dist)+'m • ⚡ '+orbs+' • 🪙 '+coins;over.style.display='flex'}function loop(t){if(!playing)return;let dt=Math.min(2,(t-last)/16.67);last=t;speed=Math.min(17,8+dist/600)+(boost?5:0);dist+=speed*.075*dt;spawn-=dt;orbSpawn-=dt;if(spawn<=0){addObj('rock');spawn=45+Math.random()*38}if(orbSpawn<=0){addObj('orb');orbSpawn=30+Math.random()*28}if(p.z>0||p.vz>0){p.z+=p.vz*dt;p.vz-=.72*dt;if(p.z<0){p.z=0;p.vz=0}}bg();for(let i=objs.length-1;i>=0;i--){let o=objs[i];o.y+=speed*dt;drawObj(o);if(hit(o)){if(o.type==='orb'){orbs++;coins+=10;if(orbs%7===0)gems++;objs.splice(i,1);continue}else{end();return}}if(o.y>H+90)objs.splice(i,1)}rider();updateHud();requestAnimationFrame(loop)}bg();</script></body></html>
