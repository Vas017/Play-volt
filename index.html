<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAY-VOLT // FROSTBOUND 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020817;font-family:Inter,Arial,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 7px #00142c}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.cluster{display:flex;gap:8px}.glass{background:linear-gradient(180deg,#082c51e8,#03182fe8);border:1px solid #62e9ff88;border-radius:18px;box-shadow:0 8px 28px #00142faa,inset 0 0 18px #4beaff12}.pill{padding:10px 15px;font-weight:900}.mission{position:absolute;top:78px;left:14px;width:210px;padding:14px;font-weight:900;font-size:12px}.mission b{display:block;font-size:16px;margin:6px 0}.bar{height:7px;background:#274762;border-radius:8px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#48eaff}.speed{position:absolute;right:14px;top:78px;padding:12px 15px;text-align:right;font-size:10px;letter-spacing:2px;font-weight:900}.speed b{display:block;font-size:27px;color:#65efff;letter-spacing:1px}.logo{position:absolute;left:18px;bottom:22px;font-size:25px;font-weight:1000;font-style:italic}.logo span{color:#42eaff}.controls{position:absolute;right:18px;bottom:28px;display:grid;gap:12px;pointer-events:auto}.btn{width:76px;height:76px;border-radius:50%;border:2px solid #dff;background:#082d54dd;color:white;font-size:31px;box-shadow:0 8px 25px #00152f,inset 0 0 20px #7df6ff22}.boost{border-color:#45edff;box-shadow:0 0 25px #22dfff77,0 8px 25px #00152f}.menu{position:fixed;inset:0;z-index:9;background:linear-gradient(#00142a66,#00142add);display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center}.title{font-size:43px;font-weight:1000;font-style:italic}.title span{color:#42eaff}.sub{font-size:12px;letter-spacing:7px;font-weight:900}.play{margin-top:24px;padding:17px 65px;border:1px solid white;border-radius:17px;background:linear-gradient(#8af8ff,#1dc8ef);color:#062b49;font-size:21px;font-weight:1000;box-shadow:0 7px #087da4,0 0 35px #43e9ff88}.hint{margin-top:18px;font-size:12px;opacity:.8}</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="glass pill">🪙 <span id="coins">2450</span></div><div class="cluster"><div class="glass pill">💎 180</div><div class="glass pill">⚡ <span id="energy">100</span>%</div></div></div><div class="glass mission">FROST MISSIONS<b>⚡ VOLT ORBS <span id="orbs">0</span>/20</b><b>⭐ RAMPS <span id="ramps">0</span>/5</b><b>🏁 <span id="dist">0</span>/3000m</b><div class="bar"><i id="prog"></i></div></div><div class="glass speed">VELOCITY<b><span id="speed">108</span> KM/H</b></div><div class="logo">PLAY-<span>VOLT</span></div><div class="controls"><button class="btn" id="jump">↑</button><button class="btn boost" id="boost">⚡</button></div></div><div class="menu" id="menu"><div class="title">PLAY-<span>VOLT</span></div><div class="sub">FROSTBOUND 3D</div><button class="play" id="play">RIDE</button><div class="hint">DRAG TO STEER • JUMP • BOOST</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">import * as THREE from 'three';const $=x=>document.getElementById(x);let run=0,dist=0,energy=100,orbs=0,ramps=0,coins=2450,boost=0,targetX=0,jumpV=0;const scene=new THREE.Scene();scene.background=new THREE.Color(0x071b45);scene.fog=new THREE.FogExp2(0x8bcce7,.012);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,700);camera.position.set(0,5.2,10.5);camera.lookAt(0,1,-10);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9be8ff,0x10274a,2.4));const sun=new THREE.DirectionalLight(0xffffff,4);sun.position.set(-12,24,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const aur=new THREE.PointLight(0x31eaff,35,70);aur.position.set(0,14,-35);scene.add(aur);function mat(c,r=.7,m=.05){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}const snow=mat(0xeafcff,.72),ice=new THREE.MeshPhysicalMaterial({color:0x76eaff,roughness:.18,metalness:.08,transmission:.15,transparent:true,opacity:.9});const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,700,12,120),snow);ground.rotation.x=-Math.PI/2;ground.position.z=-300;ground.receiveShadow=true;scene.add(ground);const track=new THREE.Mesh(new THREE.PlaneGeometry(8,700),ice);track.rotation.x=-Math.PI/2;track.position.set(0,.035,-300);track.receiveShadow=true;scene.add(track);function mountain(x,z,s){const g=new THREE.ConeGeometry(s,s*2.1,6);const o=new THREE.Mesh(g,mat(0x315d88,.9));o.position.set(x,s*.78,z);o.rotation.y=Math.random();scene.add(o);const cap=new THREE.Mesh(new THREE.ConeGeometry(s*.62,s*.72,6),snow);cap.position.set(x,s*1.55,z);cap.rotation.y=o.rotation.y;scene.add(cap)}for(let z=-45;z>-360;z-=35){mountain(-16-Math.random()*12,z,8+Math.random()*8);mountain(16+Math.random()*12,z-10,8+Math.random()*8)}function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.3,7),mat(0x4b2d22));trunk.position.set(x,.65,z);scene.add(trunk);for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.ConeGeometry(.9-i*.15,1.7,8),mat(i?0x0a5b67:0x0b7380,.75));p.position.set(x,1.25+i*.55,z);p.castShadow=true;scene.add(p)}}for(let z=-15;z>-310;z-=8){tree(-6-Math.random()*7,z,1);tree(6+Math.random()*7,z-3,1)}function tower(x,z){const b=new THREE.Mesh(new THREE.BoxGeometry(2.5,5,2.5),mat(0x173552,.7,.15));b.position.set(x,2.5,z);b.castShadow=true;scene.add(b);const roof=new THREE.Mesh(new THREE.ConeGeometry(2.1,2.3,4),snow);roof.position.set(x,6,z);roof.rotation.y=Math.PI/4;scene.add(roof);for(let y=1.5;y<4.5;y+=1.4){const w=new THREE.PointLight(0xffb72e,4,8);w.position.set(x+(x<0?1.3:-1.3),y,z);scene.add(w)}}for(let z=-55;z>-300;z-=65){tower(-10,z);tower(10,z-18)}const rider=new THREE.Group();const sled=new THREE.Mesh(new THREE.BoxGeometry(2.5,.55,3.5),mat(0x07192c,.25,.75));sled.position.y=.7;sled.castShadow=true;rider.add(sled);const nose=new THREE.Mesh(new THREE.ConeGeometry(1.25,2.3,4),mat(0x0b3854,.2,.7));nose.rotation.x=Math.PI/2;nose.rotation.z=Math.PI/4;nose.position.set(0,.85,-2);rider.add(nose);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.2,8,12),mat(0x09223d,.45));body.position.set(0,1.8,.2);rider.add(body);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.62,20,14),new THREE.MeshPhysicalMaterial({color:0x163b5e,metalness:.65,roughness:.12,clearcoat:1}));helmet.position.set(0,2.8,.05);rider.add(helmet);const visor=new THREE.Mesh(new THREE.BoxGeometry(.8,.18,.06),new THREE.MeshBasicMaterial({color:0x48efff}));visor.position.set(0,2.82,.62);rider.add(visor);const bolt=new THREE.PointLight(0x20eaff,10,10);bolt.position.set(0,1,.5);rider.add(bolt);scene.add(rider);function orb(x,z){const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(.48,.12,10,24),new THREE.MeshStandardMaterial({color:0xffc400,emissive:0xff9d00,emissiveIntensity:3,metalness:.4}));ring.rotation.x=Math.PI/2;g.add(ring);const l=new THREE.PointLight(0xffb300,8,8);g.add(l);g.position.set(x,1,z);g.userData={kind:'orb',hit:0};scene.add(g);objects.push(g)}function ramp(x,z){const r=new THREE.Mesh(new THREE.BoxGeometry(2.8,.45,4),mat(0xff7b00,.5,.1));r.rotation.x=-.18;r.position.set(x,.35,z);r.castShadow=true;r.userData={kind:'ramp',hit:0};scene.add(r);objects.push(r)}const objects=[];for(let z=-25;z>-330;z-=12)orb([-2.4,0,2.4][Math.floor(Math.random()*3)],z);for(let z=-50;z>-330;z-=55)ramp([-2.2,0,2.2][Math.floor(Math.random()*3)],z);const flakes=new THREE.BufferGeometry(),N=700,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*40;pos[i*3+1]=Math.random()*25;pos[i*3+2]=-Math.random()*180}flakes.setAttribute('position',new THREE.BufferAttribute(pos,3));const snowPts=new THREE.Points(flakes,new THREE.PointsMaterial({color:0xffffff,size:.09,transparent:true,opacity:.85}));scene.add(snowPts);$('play').onclick=()=>{run=1;$('menu').style.display='none'};let sx=0;$('game').onpointerdown=e=>sx=e.clientX;$('game').onpointermove=e=>{if(e.buttons||e.pointerType==='touch')targetX=THREE.MathUtils.clamp(targetX+(e.clientX-sx)*.018,-2.7,2.7),sx=e.clientX};$('jump').onpointerdown=()=>{if(rider.position.y<.05)jumpV=.17};const bb=$('boost');bb.onpointerdown=()=>boost=1;bb.onpointerup=bb.onpointercancel=bb.onpointerleave=()=>boost=0;function loop(){requestAnimationFrame(loop);if(run){const v=boost&&energy>1?.62:.36;dist+=v;energy=boost?Math.max(0,energy-.32):Math.min(100,energy+.09);rider.position.x+=(targetX-rider.position.x)*.12;if(jumpV||rider.position.y>0){rider.position.y+=jumpV;jumpV-=.012;if(rider.position.y<=0){rider.position.y=0;jumpV=0}}camera.position.x+=(rider.position.x*.3-camera.position.x)*.06;camera.lookAt(rider.position.x*.18,1,-10);for(const o of objects){o.position.z+=v;if(o.position.z>12)o.position.z-=330,o.userData.hit=0;o.rotation.y+=o.userData.kind==='orb'?.04:0;if(!o.userData.hit&&Math.abs(o.position.z)<2.2&&Math.abs(o.position.x-rider.position.x)<1.4){o.userData.hit=1;if(o.userData.kind==='orb'){orbs++;coins+=3;o.position.z-=330}else{ramps++;if(rider.position.y<.1)jumpV=.2}}}const a=flakes.attributes.position.array;for(let i=0;i<N;i++){a[i*3+2]+=v*.65;a[i*3+1]-=.025;if(a[i*3+2]>12)a[i*3+2]-=190;if(a[i*3+1]<0)a[i*3+1]=25}flakes.attributes.position.needsUpdate=true;$('dist').textContent=Math.floor(dist);$('speed').textContent=Math.floor((boost?182:112)+Math.sin(performance.now()/190)*6);$('energy').textContent=Math.floor(energy);$('orbs').textContent=orbs;$('ramps').textContent=ramps;$('coins').textContent=coins;$('prog').style.width=Math.min(100,dist/30)+'%'}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
